<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークシート生成ツール</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="MakeMarksheet.css">
</head>
<body>

<header>
  <div class="logo">MarkSheet</div>
  <div class="title">マークシート生成ツール</div>
  <button id="btn-theme" title="ダーク/ライト切替" style="
    margin-left:12px;background:transparent;border:1px solid var(--border);
    color:var(--text-mid);font-size:15px;width:32px;height:28px;border-radius:4px;
    cursor:pointer;line-height:1;transition:all .15s;
  ">🌙</button>
</header>

<div class="layout">
  <!-- LEFT: Controls -->
  <div class="controls">

    <div class="section-header">基本設定</div>
    <div class="ctrl-group">
      <div>
        <div class="ctrl-label">向き</div>
        <div class="seg" id="seg-orient">
          <button class="active" data-val="portrait">縦型</button>
          <button data-val="landscape">横型</button>
        </div>
      </div>
      <div>
        <div class="ctrl-label">外枠サイズ</div>
        <select id="sel-sheetsize">
          <option value="a4">A4 (210×297)</option>
          <option value="jis">JIS (82.55×187.3)</option>
          <option value="wide">幅広 (101.5×226)</option>
          <option value="custom">カスタム</option>
        </select>
      </div>
      <div class="row2" id="row-custom-size" style="display:none">
        <div>
          <div class="ctrl-label">幅 (mm)</div>
          <input type="number" id="inp-sheet-w" value="210" min="1" step="0.1">
        </div>
        <div>
          <div class="ctrl-label">高さ (mm)</div>
          <input type="number" id="inp-sheet-h" value="297" min="1" step="0.1">
        </div>
      </div>
      <div>
        <div class="ctrl-label">TM配置方式</div>
        <div class="seg" id="seg-tmtype">
          <button class="active" data-val="control">制御型</button>
          <button data-val="direct">直下型</button>
        </div>
      </div>
      <div>
        <div class="ctrl-label">裏面</div>
        <div class="seg" id="seg-back">
          <button class="active" data-val="false">なし</button>
          <button data-val="true">あり</button>
        </div>
      </div>
      <div id="row-side" style="display:none">
        <div class="ctrl-label">表示面</div>
        <div class="seg" id="seg-side">
          <button class="active" data-val="front">表面</button>
          <button data-val="back">裏面</button>
        </div>
      </div>
      <div class="row2">
        <div>
          <div class="ctrl-label">ピッチ</div>
          <select id="sel-pitch">
            <option value="0.25">0.25</option>
            <option value="1/6">1/6</option>
            <option value="0.2">0.2</option>
            <option value="0.2s">0.2s</option>
            <option value="0.3">0.3</option>
            <option value="0.3F">0.3F</option>
          </select>
        </div>
        <div>
          <div class="ctrl-label">TM間隔 (mm)</div>
          <input type="number" id="inp-tmi" value="4.23" min="4.23" step="0.01">
        </div>
      </div>
    </div>
    
    <div class="section-header">受験番号欄</div>
    <div class="ctrl-group">
      <div>
        <div class="ctrl-label">受験番号欄</div>
        <div class="seg" id="seg-examnum">
          <button class="active" data-val="true">あり</button>
          <button data-val="false">なし</button>
        </div>
      </div>
      <div id="row-digits">
        <div class="ctrl-label">桁数</div>
        <input type="number" id="inp-digits" value="5" min="1">
      </div>
    </div>

    <div class="section-header">解答欄</div>
    <div class="ctrl-group">
      <div class="row2">
        <div>
          <div class="ctrl-label">問題数</div>
          <input type="number" id="inp-qcount" value="50" min="1">
        </div>
        <div>
          <div class="ctrl-label">選択肢数</div>
          <input type="number" id="inp-ccount" value="5" min="1">
        </div>
      </div>
      <div class="row2">
        <div>
          <div class="ctrl-label">MB長辺 (mm)</div>
          <input type="number" id="inp-mblong" value="4" min="0.1" step="0.1">
        </div>
        <div>
          <div class="ctrl-label">MB短辺 (mm)</div>
          <input type="number" id="inp-mbshort" value="2" min="0.1" step="0.1">
        </div>
      </div>
    </div>

    <div class="accordion-header" data-target="acc-advanced">
      詳細設定 <span class="acc-arrow">▼</span>
    </div>
    <div class="accordion-body" id="acc-advanced">
      <div class="ctrl-group">
        <div class="row2">
          <div id="row-skipmb">
            <div class="ctrl-label">MBインターバル</div>
            <input type="number" id="inp-skip" value="1" min="0">
          </div>
          <div id="row-backskipmb">
            <div class="ctrl-label">裏面のMBインターバル</div>
            <input type="number" id="inp-backskip" value="1" min="0">
          </div>
        </div>
        <div id="row-maxrowsl">
          <div class="ctrl-label">MB最大</div>
          <input type="number" id="inp-maxrowsl" value="30" min="1">
        </div>
        <div class="row2">
          <div>
            <div class="ctrl-label">解答欄インターバル</div>
            <input type="number" id="inp-colgap" value="1" min="0" step="0.5">
          </div>
          <div>
            <div class="ctrl-label">受験番号インターバル</div>
            <input type="number" id="inp-secgap" value="1" min="0" step="0.5">
          </div>
        </div>
      </div>
    </div>

    <div class="accordion-header" data-target="acc-pitch">
      ピッチの仕様参照 <span class="acc-arrow">▼</span>
    </div>
    <div class="accordion-body" id="acc-pitch">
      <div class="ctrl-group">
        <table class="pitch-table" id="pitch-table">
          <thead>
            <tr><th>ピッチ</th><th>pitch</th><th>firstX</th><th>maxMB</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="computed-vals" id="computed-vals"></div>
      </div>
    </div>

    <button class="generate-btn" id="btn-gen">▶ プレビュー更新</button>
    <div class="warn-box" id="warn-box" style="margin-top:12px">
      <div class="warn-title">警告</div>
      <ul id="warn-list"></ul>
    </div>
    <button class="pdf-btn" id="btn-pdf">⬇ PDF出力</button>
  </div>

  <!-- RIGHT: Canvas -->
  <div class="canvas-area">
    <div id="sheet-wrapper">
      <canvas id="sheet-canvas"></canvas>
    </div>
  </div>
</div>

<script src="MakeMarksheet.js"></script>
</body>
</html>
