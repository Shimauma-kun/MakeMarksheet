<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークシート生成ツール — SR-3500</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #161820;
    --panel: #1c1e24;
    --border: #2a2d38;
    --accent: #e84393;
    --accent2: #00d4a0;
    --text: #e8eaf0;
    --text-dim: #6b7080;
    --text-mid: #9ba3b8;
    --warn: #f59e0b;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }
  header .logo {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
  }
  header .title {
    font-size: 13px;
    color: var(--text-mid);
    font-weight: 300;
  }
  header .device-badge {
    margin-left: auto;
    background: #1a2a20;
    border: 1px solid #2a4a38;
    color: var(--accent2);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 3px;
  }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 49px);
  }

  /* --- LEFT PANEL: Controls --- */
  .controls {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .section-header {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--border);
  }

  .ctrl-group {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--text-mid);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ctrl-label span {
    font-family: var(--mono);
    color: var(--accent2);
    font-size: 10px;
  }

  .seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .seg button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-family: var(--sans);
    font-size: 12px;
    padding: 7px 4px;
    cursor: pointer;
    transition: all .15s;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active {
    background: var(--accent);
    color: #fff;
  }
  .seg button:hover:not(.active) { background: var(--panel); color: var(--text); }

  select, input[type=number], input[type=text] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    width: 100%;
    appearance: none;
    outline: none;
    transition: border-color .15s;
  }
  select:focus, input:focus {
    border-color: var(--accent);
  }
  select { cursor: pointer; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .pitch-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 10px;
  }
  .pitch-table th {
    color: var(--text-dim);
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .pitch-table td {
    color: var(--text-mid);
    padding: 3px 6px;
  }
  .pitch-table tr.active-row td {
    color: var(--accent2);
  }

  .generate-btn {
    margin: 16px 16px 0;
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity .15s;
    text-transform: uppercase;
  }
  .generate-btn:hover { opacity: .85; }

  .pdf-btn {
    margin: 8px 16px 0;
    background: transparent;
    border: 1px solid var(--accent2);
    color: var(--accent2);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 11px;
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s;
    text-transform: uppercase;
    width: calc(100% - 32px);
  }
  .pdf-btn:hover { background: var(--accent2); color: #000; }
  .pdf-btn:disabled { opacity: .4; cursor: not-allowed; }

  .warn-box {
    margin: 0 16px 16px;
    background: #2a1f0a;
    border: 1px solid #5a3f10;
    border-radius: 4px;
    padding: 10px 12px;
    display: none;
  }
  .warn-box.visible { display: block; }
  .warn-box .warn-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--warn);
    letter-spacing: .1em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .warn-box ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .warn-box li {
    font-size: 11px;
    color: #d4a040;
  }
  .warn-box li::before { content: '⚠ '; }

  /* --- RIGHT PANEL: Canvas --- */
  .canvas-area {
    flex: 1;
    overflow: auto;
    background: #0a0b0d;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px;
  }

  #sheet-wrapper {
    background: #fff;
    box-shadow: 0 8px 60px rgba(0,0,0,.8), 0 0 0 1px #333;
    position: relative;
    flex-shrink: 0;
  }

  #sheet-canvas {
    display: block;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .info-row {
    display: flex;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .info-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 3px;
    color: var(--text-mid);
  }
  .info-chip b { color: var(--accent2); font-weight: 500; }

  .computed-vals {
    padding: 8px 0 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cv-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
  .cv-row span:last-child { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div class="logo">MarkSheet</div>
  <div class="title">マークシート生成ツール</div>
  <div class="device-badge">SECONIK SR-3500</div>
</header>

<div class="layout">
  <!-- LEFT: Controls -->
  <div class="controls">

    <div class="section-header">基本設定</div>
    <div class="ctrl-group">
      <div>
        <div class="ctrl-label">向き</div>
        <div class="seg" id="seg-orient">
          <button class="active" data-val="portrait">縦型 A4</button>
          <button data-val="landscape">横型 A4</button>
        </div>
      </div>
      <div>
        <div class="ctrl-label">TM配置方式</div>
        <div class="seg" id="seg-tmtype">
          <button class="active" data-val="control">制御型</button>
          <button data-val="direct">直下型</button>
        </div>
      </div>
      <div>
        <div class="ctrl-label">ピッチ <span id="lbl-pitch">0.25</span></div>
        <select id="sel-pitch">
          <option value="0.25">0.25</option>
          <option value="1/6">1/6</option>
          <option value="0.2">0.2</option>
          <option value="0.2s">0.2s</option>
          <option value="0.3">0.3</option>
          <option value="0.3F">0.3F</option>
        </select>
      </div>
      <div>
        <div class="ctrl-label">TM間隔 (mm) <span id="lbl-tmi">4.23</span></div>
        <input type="number" id="inp-tmi" value="4.23" min="4.23" step="0.01">
      </div>
    </div>

    <div class="section-header">解答欄</div>
    <div class="ctrl-group">
      <div class="row2">
        <div>
          <div class="ctrl-label">問題数</div>
          <input type="number" id="inp-qcount" value="50" min="1" max="300">
        </div>
        <div>
          <div class="ctrl-label">選択肢数</div>
          <input type="number" id="inp-ccount" value="5" min="1" max="20">
        </div>
      </div>
      <div class="row2">
        <div>
          <div class="ctrl-label">MB長辺 (mm)</div>
          <input type="number" id="inp-mblong" value="4" min="0.1" step="0.1">
        </div>
        <div>
          <div class="ctrl-label">MB短辺 (mm)</div>
          <input type="number" id="inp-mbshort" value="2" min="0.1" step="0.1">
        </div>
      </div>
      <div id="row-maxrowsl">
        <div class="ctrl-label">横型最大行数 (maxRowsL) <span id="lbl-maxrowsl">30</span></div>
        <input type="number" id="inp-maxrowsl" value="30" min="1" max="100">
      </div>
      <div id="row-skipmb">
        <div class="ctrl-label">開始オフセット (skipMB) <span id="lbl-skip">2</span></div>
        <input type="number" id="inp-skip" value="2" min="0" max="10">
      </div>
      <div class="row2">
        <div>
          <div class="ctrl-label">列ギャップ<span id="lbl-colgap-unit">(pitch×)</span></div>
          <input type="number" id="inp-colgap" value="2" min="0" step="0.5">
        </div>
        <div>
          <div class="ctrl-label">セクションギャップ (tmInterval×)</div>
          <input type="number" id="inp-secgap" value="2" min="0" step="0.5">
        </div>
      </div>
    </div>

    <div class="section-header">受験番号欄</div>
    <div class="ctrl-group">
      <div>
        <div class="ctrl-label">桁数 <span id="lbl-digits">5</span></div>
        <input type="number" id="inp-digits" value="5" min="1" max="20">
      </div>
    </div>

    <div class="section-header">ピッチマスター参照</div>
    <div class="ctrl-group">
      <table class="pitch-table" id="pitch-table">
        <thead>
          <tr><th>ピッチ</th><th>pitch</th><th>firstX</th><th>maxMB</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="computed-vals" id="computed-vals"></div>
    </div>

    <button class="generate-btn" id="btn-gen">▶ プレビュー更新</button>
    <button class="pdf-btn" id="btn-pdf">⬇ PDF出力</button>
    <div class="warn-box" id="warn-box" style="margin-top:12px">
      <div class="warn-title">警告</div>
      <ul id="warn-list"></ul>
    </div>
  </div>

  <!-- RIGHT: Canvas -->
  <div class="canvas-area">
    <div id="sheet-wrapper">
      <canvas id="sheet-canvas"></canvas>
    </div>
  </div>
</div>

<script>
// =============================================
// PITCH MASTER
// =============================================
const PITCH_MASTER = {
  '0.25': { pitch:6.35,   firstX:6.35,  maxMB:33, tmS:0.89, tmL:5.9,  tmPos:-2.0,  maxRowsL:30 },
  '1/6':  { pitch:4.233,  firstX:11.43, maxMB:48, tmS:1.27, tmL:3.81, tmPos:5.085, maxRowsL:43 },
  '0.2':  { pitch:5.08,   firstX:11.75, maxMB:40, tmS:0.89, tmL:5.9,  tmPos:-2.0,  maxRowsL:36 },
  '0.2s': { pitch:5.08,   firstX:12.7,  maxMB:40, tmS:0.89, tmL:3.81, tmPos:5.095, maxRowsL:36 },
  '0.3':  { pitch:7.62,   firstX:14.50, maxMB:27, tmS:0.89, tmL:7.0,  tmPos:-2.0,  maxRowsL:24 },
  '0.3F': { pitch:7.62,   firstX:17.78, maxMB:24, tmS:0.5,  tmL:5.08, tmPos:7.62,  maxRowsL:24 },
};

// Paper sizes (mm)
const PAPER = {
  portrait:  { a4w:210, a4h:297, b4w:257, b4h:364 },
  landscape: { a4w:297, a4h:210, b4w:364, b4h:257 },
};

// MB size (mm) — デフォルト値（stateで管理）
const MB_LONG_DEFAULT = 4, MB_SHORT_DEFAULT = 2;
const PAD = 2; // frame padding mm
const FIXED_SKIP_MB = 2; // 第1・第2MBは常に使用しない（SR-3500仕様）

// =============================================
// State
// =============================================
let state = {
  orientation: 'portrait',
  tmType: 'control',  // 'control'=制御型 / 'direct'=直下型
  pitchName: '0.25',
  tmInterval: 4.23,
  questionCount: 50,
  choiceCount: 5,
  skipMB: 2,
  columnGapMult: 2,
  sectionGapMult: 2,
  examDigits: 5,
  mbLong: MB_LONG_DEFAULT,   // MB長辺(mm)
  mbShort: MB_SHORT_DEFAULT, // MB短辺(mm)
  maxRowsL: PITCH_MASTER['0.25'].maxRowsL, // 横型最大行数
};

// =============================================
// DOM refs
// =============================================
const canvas = document.getElementById('sheet-canvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('sheet-wrapper');
const warnBox = document.getElementById('warn-box');
const warnList = document.getElementById('warn-list');
const computedVals = document.getElementById('computed-vals');
const rowSkipMb = document.getElementById('row-skipmb');

// =============================================
// UI Bindings
// =============================================
function initPitchTable() {
  const tbody = document.querySelector('#pitch-table tbody');
  tbody.innerHTML = '';
  Object.entries(PITCH_MASTER).forEach(([name, p]) => {
    const tr = document.createElement('tr');
    tr.dataset.pitch = name;
    tr.innerHTML = `<td>${name}</td><td>${p.pitch}</td><td>${p.firstX}</td><td>${p.maxMB}</td>`;
    tbody.appendChild(tr);
  });
  updatePitchTable();
}

function updatePitchTable() {
  document.querySelectorAll('#pitch-table tbody tr').forEach(tr => {
    tr.classList.toggle('active-row', tr.dataset.pitch === state.pitchName);
  });
}

// Segmented buttons
document.querySelectorAll('#seg-orient button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#seg-orient button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.orientation = btn.dataset.val;
    document.getElementById('lbl-colgap-unit').textContent =
      state.orientation === 'portrait' ? '(pitch×)' : '(tmInterval×)';
    document.getElementById('row-maxrowsl').style.display =
      state.orientation === 'landscape' ? '' : 'none';
    render();
  });
});

// TM配置方式
document.querySelectorAll('#seg-tmtype button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#seg-tmtype button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tmType = btn.dataset.val;
    render();
  });
});

// Select
document.getElementById('sel-pitch').addEventListener('change', e => {
  state.pitchName = e.target.value;
  document.getElementById('lbl-pitch').textContent = e.target.value;
  // maxRowsLをピッチのデフォルト値にリセット
  const defaultRows = PITCH_MASTER[e.target.value].maxRowsL;
  state.maxRowsL = defaultRows;
  document.getElementById('inp-maxrowsl').value = defaultRows;
  document.getElementById('lbl-maxrowsl').textContent = defaultRows;
  updatePitchTable();
  render();
});

// Numbers
function bindNum(id, key, label) {
  const el = document.getElementById(id);
  const lbl = label ? document.getElementById(label) : null;
  el.addEventListener('input', () => {
    state[key] = parseFloat(el.value) || 0;
    if (lbl) lbl.textContent = el.value;
    render();
  });
}
bindNum('inp-tmi',     'tmInterval',     'lbl-tmi');
bindNum('inp-qcount',  'questionCount');
bindNum('inp-ccount',  'choiceCount');
bindNum('inp-mblong',  'mbLong');
bindNum('inp-mbshort', 'mbShort');
bindNum('inp-maxrowsl','maxRowsL',       'lbl-maxrowsl');
bindNum('inp-skip',    'skipMB',         'lbl-skip');
bindNum('inp-colgap',  'columnGapMult');
bindNum('inp-secgap',  'sectionGapMult');
bindNum('inp-digits',  'examDigits',     'lbl-digits');

document.getElementById('btn-gen').addEventListener('click', render);

// =============================================
// SCALE: mm -> canvas pixels
// =============================================
let MM2PX = 3.7795; // default, recalculated

function mm(v) { return v * MM2PX; }

// =============================================
// WARNINGS
// =============================================
function checkWarnings(p, outer) {
  const warns = [];
  if (state.tmInterval < 4.23) warns.push('TM間隔が最小値(4.23mm)未満です');

  if (state.orientation === 'landscape') {
    // 横型: 数字9のy check
    const examTopY = outer.y2 - p.firstX - 29 * p.pitch;
    const y9 = examTopY + 9 * p.pitch;
    if (y9 > outer.y2) warns.push('受験番号欄の数字9行が外枠外にはみ出します');
  }
  return warns;
}

// =============================================
// COMPUTED VALUES DISPLAY
// =============================================
function showComputedVals(p, outer) {
  const lines = [];
  if (state.orientation === 'portrait') {
    const enStart = p.firstX + state.tmInterval * 3;
    const examEndY = enStart + 9 * state.tmInterval;
    const sectionGap = p.pitch * state.sectionGapMult;
    const ansStartY = examEndY + sectionGap;
    lines.push(['enStart (along)', enStart.toFixed(2) + 'mm']);
    lines.push(['ansStartY', ansStartY.toFixed(2) + 'mm']);
    lines.push(['columnGap', (p.pitch * state.columnGapMult).toFixed(2) + 'mm']);
  } else {
    const ansStartY = outer.y2 - p.firstX - 29 * p.pitch;
    const enStart = p.firstX + state.tmInterval * 3;
    lines.push(['ansStartY (固定)', ansStartY.toFixed(2) + 'mm']);
    lines.push(['enStart (along)', enStart.toFixed(2) + 'mm']);
  }
  lines.push(['pitch', p.pitch + 'mm']);
  lines.push(['tmInterval', state.tmInterval.toFixed(2) + 'mm']);
  computedVals.innerHTML = lines.map(([k,v]) =>
    `<div class="cv-row"><span>${k}</span><span>${v}</span></div>`
  ).join('');
}

// =============================================
// MAIN RENDER
// =============================================
function render() {
  const p = PITCH_MASTER[state.pitchName];
  const paper = PAPER[state.orientation];
  const isPortrait = state.orientation === 'portrait';
  const outer = { x1:0, y1:0, x2:paper.a4w, y2:paper.a4h };

  // Warnings
  const warns = checkWarnings(p, outer);
  warnList.innerHTML = warns.map(w=>`<li>${w}</li>`).join('');
  warnBox.classList.toggle('visible', warns.length > 0);
  showComputedVals(p, outer);

  // Setup canvas
  const DPR = window.devicePixelRatio || 1;
  const DISPLAY_W = 680;
  MM2PX = DISPLAY_W / paper.b4w;

  const canvasW = Math.round(mm(paper.b4w));
  const canvasH = Math.round(mm(paper.b4h));
  canvas.width  = canvasW * DPR;
  canvas.height = canvasH * DPR;
  canvas.style.width  = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.scale(DPR, DPR);
  wrapper.style.width  = canvasW + 'px';
  wrapper.style.height = canvasH + 'px';

  const ofx = (paper.b4w - paper.a4w) / 2;
  const ofy = (paper.b4h - paper.a4h) / 2;

  // Canvas background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);
  // A4外枠: マゼンタ100% 0.4pt
  const LW_OUTER_PX = (0.4 / 2.835) * MM2PX;
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = LW_OUTER_PX;
  ctx.strokeRect(mm(ofx), mm(ofy), mm(paper.a4w), mm(paper.a4h));

  // Canvas drawing API wrapper
  const canvasAPI = {
    setFill:   (r,g,b)   => { ctx.fillStyle   = `rgb(${r},${g},${b})`; },
    setStroke: (r,g,b,w) => { ctx.strokeStyle = `rgb(${r},${g},${b})`; ctx.lineWidth = w * MM2PX; },
    rect:  (x,y,w,h)     => { ctx.fillRect(mm(ofx+x), mm(ofy+y), mm(w), mm(h)); },
    strokeRect: (x,y,w,h)=> { ctx.strokeRect(mm(ofx+x), mm(ofy+y), mm(w), mm(h)); },
    ellipse: (cx,cy,rx,ry,fill) => {
      ctx.beginPath();
      ctx.ellipse(mm(ofx+cx), mm(ofy+cy), mm(rx), mm(ry), 0, 0, Math.PI*2);
      if (fill) { ctx.fill(); } else { ctx.stroke(); }
    },
    text: (x,y,str,sizeMm,align,font) => {
      ctx.font = `${mm(sizeMm)}px ${font}`;
      ctx.textAlign  = align;
      ctx.textBaseline = 'middle';
      ctx.fillText(str, mm(ofx+x), mm(ofy+y));
    },
  };

  drawLayout(canvasAPI, p, paper, isPortrait);
}

// =============================================
// PDF EXPORT
// =============================================
document.getElementById('btn-pdf').addEventListener('click', exportPDF);

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const p = PITCH_MASTER[state.pitchName];
  const paper = PAPER[state.orientation];
  const isPortrait = state.orientation === 'portrait';

  const orientation = isPortrait ? 'portrait' : 'landscape';
  const doc = new jsPDF({ orientation, unit: 'mm', format: [paper.b4w, paper.b4h] });

  const ofx = (paper.b4w - paper.a4w) / 2;
  const ofy = (paper.b4h - paper.a4h) / 2;

  // A4外枠: マゼンタ100% CMYK(0,100,0,0) 0.4pt
  doc.setDrawColor(0, 100, 0, 0); // jsPDF CMYK
  doc.setLineWidth(0.4 / 2.835);
  doc.rect(ofx, ofy, paper.a4w, paper.a4h, 'S');

  // PDF drawing API wrapper (CMYK)
  const pdfAPI = {
    // r,g,b は内部的にマゼンタ(255,0,255)か黒(0,0,0)を識別してCMYKに変換
    setFill: (r,g,b) => {
      if (r===0 && g===0 && b===0)       doc.setFillColor(0, 0, 0, 100);   // K100%
      else if (r===255 && g===0 && b===255) doc.setFillColor(0, 100, 0, 0); // M100%
      else doc.setFillColor(r, g, b);
    },
    setStroke: (r,g,b,w) => {
      if (r===0 && g===0 && b===0)          doc.setDrawColor(0, 0, 0, 100);
      else if (r===255 && g===0 && b===255) doc.setDrawColor(0, 100, 0, 0);
      else doc.setDrawColor(r, g, b);
      doc.setLineWidth(w);
    },
    rect:  (x,y,w,h)     => { doc.rect(ofx+x, ofy+y, w, h, 'F'); },
    strokeRect: (x,y,w,h)=> { doc.rect(ofx+x, ofy+y, w, h, 'S'); },
    ellipse: (cx,cy,rx,ry,fill) => {
      doc.ellipse(ofx+cx, ofy+cy, rx, ry, fill ? 'F' : 'S');
    },
    text: (x,y,str,sizeMm,align,_font) => {
      doc.setFontSize(sizeMm * 2.835);
      doc.text(String(str), ofx+x, ofy+y, { align });
    },
  };

  drawLayout(pdfAPI, p, paper, isPortrait);

  const orient = isPortrait ? 'portrait' : 'landscape';
  doc.save(`marksheet_${orient}_${state.pitchName}.pdf`);
}

// =============================================
// SHARED DRAW LOGIC
// =============================================
function drawLayout(api, p, paper, isPortrait) {
  const outer = { x1:0, y1:0, x2:paper.a4w, y2:paper.a4h };
  const tmInterval = state.tmInterval;
  const pitch = p.pitch;
  const firstX = p.firstX;
  const tmS = p.tmS;
  const tmL = p.tmL;
  const tmPos = p.tmPos;
  const skipMB = state.skipMB;
  const MB_LONG  = state.mbLong;   // ユーザー変更可能
  const MB_SHORT = state.mbShort;  // ユーザー変更可能
  const maxRowsL = state.maxRowsL; // ユーザー変更可能（横型のみ）

  const MARGIN = 9;
  const enStart = MARGIN + tmS * 1.5 + MB_SHORT / 2;

  const sectionGap = tmInterval * state.sectionGapMult;
  const columnGap = isPortrait
    ? pitch * state.columnGapMult
    : tmInterval * state.columnGapMult;

  const PT2MM = 1 / 2.835;
  const LW_OUTER = 0.4 * PT2MM;
  const LW_MB    = 0.6 * PT2MM;
  const FS_MB_PDF    = 7 * PT2MM;
  const FS_MB_CANVAS = MB_SHORT * 0.65;
  const FS_QLABEL    = MB_SHORT * 1.5;

  // =============================================
  // Draw TMs for a given set of along-positions
  // =============================================
  const tmAlongPositions = new Set();

  function collectTM(alongCenter) {
    tmAlongPositions.add(parseFloat(alongCenter.toFixed(3)));
  }

  function drawAllTMs() {
    // 制御型: TM上端 = MB中心 - tmS×1.5
    // 直下型: TM上端 = MB中心 - tmS/2  (TM中心=MB中心)
    const tmOffset = state.tmType === 'control' ? tmS * 1.5 : tmS / 2;
    api.setFill(0, 0, 0);
    const sorted = [...tmAlongPositions].sort((a,b)=>a-b);
    sorted.forEach(alongCenter => {
      if (isPortrait) {
        const tx = outer.x1 + tmPos;
        const ty = alongCenter - tmOffset;
        api.rect(tx, ty, tmL, tmS);
      } else {
        const ty = outer.y2 - tmPos - tmL;
        const tx = alongCenter - tmOffset;
        api.rect(tx, ty, tmS, tmL);
      }
    });
  }

  // Draw a single MB (ellipse) — 塗りなし・線のみ
  function drawMB(cx, cy, portrait) {
    const rx = portrait ? MB_LONG/2 : MB_SHORT/2;
    const ry = portrait ? MB_SHORT/2 : MB_LONG/2;
    api.setStroke(255, 0, 255, LW_MB); // マゼンタ100%
    api.ellipse(cx, cy, rx, ry, false);
  }

  // Draw text inside MB: MSゴシック マゼンタ100%
  // Canvas: MB短辺の0.7倍(視認用)、PDF: 0.7pt
  function drawMBText(cx, cy, text) {
    api.setFill(255, 0, 255);
    api.text(cx, cy, text, FS_MB_PDF, 'center', "'MS Gothic', 'MS ゴシック', monospace");
  }

  // Draw question number label: マゼンタ100%
  function drawQLabel(cx, cy, text) {
    api.setFill(255, 0, 255);
    api.text(cx - MB_LONG/2 - 0.5, cy, text, MB_SHORT * 1.5, 'right', "'Noto Sans JP', sans-serif");
  }

  // Draw frame rect — マゼンタ100% 0.4pt
  function drawFrame(x1, y1, x2, y2) {
    api.setStroke(255, 0, 255, LW_OUTER);
    api.strokeRect(x1 - PAD, y1 - PAD, (x2 - x1) + PAD*2, (y2 - y1) + PAD*2);
  }

  // =============================================
  // PORTRAIT Layout
  // =============================================
  if (isPortrait) {
    const examDigits = state.examDigits;
    const enStartY = enStart;
    const enEndY   = enStart + 9 * tmInterval;
    const enStartX = outer.x1 + firstX + skipMB * pitch;
    const enEndX   = enStartX + (examDigits - 1) * pitch;

    for (let ri = 0; ri <= 9; ri++) collectTM(enStart + ri * tmInterval);

    drawFrame(enStartX - MB_LONG/2, enStartY - MB_SHORT/2,
              enEndX   + MB_LONG/2, enEndY   + MB_SHORT/2);

    for (let di = 0; di < examDigits; di++) {
      const cx = outer.x1 + firstX + (skipMB + di) * pitch;
      for (let ri = 0; ri <= 9; ri++) {
        const cy = enStart + ri * tmInterval;
        drawMB(cx, cy, true);
        drawMBText(cx, cy, ri.toString());
      }
    }

    const ansStartY = enEndY + sectionGap;
    const colWidth  = (state.choiceCount - 1) * pitch;
    const baseX     = outer.x1 + firstX + skipMB * pitch;
    // TM下端も9mm余白に収める: MB中心上限 = outer.y2 - MARGIN - tmS*1.5 - MB_SHORT/2
    const maxYmm    = outer.y2 - MARGIN - tmS * 1.5 - MB_SHORT / 2;
    const colMBrows = Math.floor((maxYmm - ansStartY) / tmInterval) + 1;
    const qPerCol   = Math.min(colMBrows, state.questionCount);

    let qi = 0, colIndex = 0;
    const colPositions = [];

    while (qi < state.questionCount) {
      const colBaseX = baseX + colIndex * (colWidth + columnGap);
      let frameMinY = Infinity, frameMaxY = -Infinity;

      for (let r = 0; r < qPerCol && qi < state.questionCount; r++, qi++) {
        const cy = ansStartY + r * tmInterval;
        collectTM(cy);
        frameMinY = Math.min(frameMinY, cy);
        frameMaxY = Math.max(frameMaxY, cy);
        drawQLabel(colBaseX, cy, `${qi+1}`);
        for (let ci = 0; ci < state.choiceCount; ci++) {
          drawMB(colBaseX + ci * pitch, cy, true);
          drawMBText(colBaseX + ci * pitch, cy, (ci+1).toString());
        }
      }
      colPositions.push({
        x1: colBaseX - MB_LONG/2,          y1: frameMinY - MB_SHORT/2,
        x2: colBaseX + (state.choiceCount-1)*pitch + MB_LONG/2, y2: frameMaxY + MB_SHORT/2,
      });
      colIndex++;
    }

    colPositions.forEach(f => drawFrame(f.x1, f.y1, f.x2, f.y2));
    drawAllTMs();

  } else {
    // =============================================
    // LANDSCAPE Layout
    // =============================================
    const mbBase        = outer.y2 - firstX;
    const ansStartY     = mbBase - (maxRowsL - 1) * pitch;  // 第maxRowsL番MBのy（固定）
    const examTopY      = ansStartY;
    const maxRowsPerCol = maxRowsL - skipMB;  // 最大行数 - skipMB
    const examDigits    = state.examDigits;

    for (let di = 0; di < examDigits; di++) collectTM(enStart + di * tmInterval);

    const enStartXcoord = enStart;
    const enEndXcoord   = enStart + (examDigits-1) * tmInterval;
    const enEndYcoord   = examTopY + 9 * pitch;

    drawFrame(enStartXcoord - MB_SHORT/2, examTopY   - MB_LONG/2,
              enEndXcoord   + MB_SHORT/2, enEndYcoord + MB_LONG/2);

    for (let di = 0; di < examDigits; di++) {
      const cx = enStart + di * tmInterval;
      for (let ri = 0; ri <= 9; ri++) {
        drawMB(cx, examTopY + ri * pitch, false);
        drawMBText(cx, examTopY + ri * pitch, ri.toString());
      }
    }

    const ansStart = enEndXcoord + sectionGap;
    const colWidth  = (state.choiceCount - 1) * tmInterval;
    // TM右端も9mm余白に収める: MB中心上限 = outer.x2 - MARGIN - tmS*1.5 - MB_SHORT/2
    const maxXmm    = outer.x2 - MARGIN - tmS * 1.5 - MB_SHORT / 2;

    let qi = 0, colIndex = 0;
    while (qi < state.questionCount) {
      const colBaseX = ansStart + colIndex * (colWidth + columnGap);
      if (colBaseX > maxXmm) break;

      let frameMinY = Infinity, frameMaxY = -Infinity;
      const frameMinX = colBaseX - MB_SHORT/2;
      const frameMaxX = colBaseX + (state.choiceCount-1)*tmInterval + MB_SHORT/2;
      const qThisCol  = Math.min(maxRowsPerCol, state.questionCount - qi);

      for (let r = 0; r < qThisCol; r++, qi++) {
        const cy = ansStartY + r * pitch;
        frameMinY = Math.min(frameMinY, cy - MB_LONG/2);
        frameMaxY = Math.max(frameMaxY, cy + MB_LONG/2);
        drawQLabel(colBaseX, cy, `${qi+1}`);
        for (let ci = 0; ci < state.choiceCount; ci++) {
          const cx = colBaseX + ci * tmInterval;
          collectTM(cx);
          drawMB(cx, cy, false);
          drawMBText(cx, cy, (ci+1).toString());
        }
      }
      drawFrame(frameMinX, frameMinY, frameMaxX, frameMaxY);
      colIndex++;
    }
    drawAllTMs();
  }
}

// =============================================
// Init
// =============================================
initPitchTable();
document.getElementById('row-maxrowsl').style.display = 'none';
render();
</script>
