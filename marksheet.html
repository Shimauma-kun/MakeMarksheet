<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マークシート生成ツール</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    h2 { color: #569cd6; margin: 0 0 12px; }
    label { color: #4ec9b0; margin-right: 12px; }
    select, input[type=number] { background: #2d2d2d; color: #d4d4d4; border: 1px solid #555; padding: 2px 4px; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; background: #0e639c; color: #fff; border: none; border-radius: 4px; font-size: 14px; }
    button:hover { background: #1177bb; }
    #output { margin-top: 12px; white-space: pre; font-size: 12px; color: #9cdcfe; line-height: 1.6; }
    #preview { margin-top: 16px; overflow: auto; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>マークシート生成ツール</h2>
  <div class="row">
    <label>向き:
      <select id="orientation">
        <option value="portrait">縦型</option>
        <option value="landscape">横型</option>
      </select>
    </label>
    <label>ピッチ:
      <select id="pitch">
        <option value="0.25">0.25</option>
        <option value="1/6">1/6</option>
        <option value="0.2">0.2</option>
        <option value="0.2s">0.2s</option>
        <option value="0.3">0.3</option>
        <option value="0.3F">0.3F</option>
      </select>
    </label>
    <label>受験番号桁数: <input id="examDigits"    type="number" value="5"  min="1" max="20" style="width:50px"></label>
    <label>問題数:       <input id="questionCount" type="number" value="50" min="1"          style="width:60px"></label>
    <label>選択肢数:     <input id="choiceCount"   type="number" value="5"  min="1" max="10" style="width:50px"></label>
  </div>
  <div class="row">
    <label>開始MB番号（縦型:解答欄開始along位置/横型:問1の物理MB番号）:
      <input id="startMB" type="number" value="24" min="1" max="48" style="width:55px">
    </label>
    <label>列間隔(pitch×):
      <input id="columnGapMult" type="number" value="2" min="0" max="10" step="0.5" style="width:50px">
    </label>
    <label>セクション間隔(pitch×):
      <input id="sectionGapMult" type="number" value="2" min="0" max="10" step="0.5" style="width:50px">
    </label>
  </div>
  <div class="row">
    <button id="btnRun">計算実行 ＋ プレビュー</button>
    <button id="btnClear">クリア</button>
  </div>
  <div id="output"></div>
  <div id="preview"></div>

  <script>
    const PITCH_MASTER = {
      '0.25': { pitch: 6.35,  firstX: 6.35,  maxMB: 33, tmS: 0.89, tmL: 5.9,  tmPos: -2.0   },
      '1/6':  { pitch: 4.233, firstX: 11.43, maxMB: 48, tmS: 1.27, tmL: 3.81, tmPos:  5.085 },
      '0.2':  { pitch: 5.08,  firstX: 11.75, maxMB: 40, tmS: 0.89, tmL: 5.9,  tmPos: -2.0   },
      '0.2s': { pitch: 5.08,  firstX: 12.7,  maxMB: 40, tmS: 0.89, tmL: 3.81, tmPos:  5.095 },
      '0.3':  { pitch: 7.62,  firstX: 14.50, maxMB: 27, tmS: 0.89, tmL: 7.0,  tmPos: -2.0   },
      '0.3F': { pitch: 7.62,  firstX: 17.78, maxMB: 24, tmS: 0.5,  tmL: 5.08, tmPos:  7.62  },
    };
    const PAPER_SIZE = {
      portrait:  { outerW: 210, outerH: 297, boardW: 257, boardH: 364 },
      landscape: { outerW: 297, outerH: 210, boardW: 364, boardH: 257 },
    };
    const MB_L = 4.0, MB_S = 2.0;
    const PAD = 2.0; // 枠のパディング(mm)

    function getOuter(o) {
      const s = PAPER_SIZE[o];
      return { x1:0, y1:0, x2:s.outerW, y2:s.outerH };
    }

    // ── TM座標 ──────────────────────────────────────────────────
    function calcTM(orientation, pm, alongPos) {
      const outer = getOuter(orientation);
      if (orientation === 'portrait') {
        // 縦型: TM横長、左辺。tmPos<0なら外枠外（左）
        return {
          x: outer.x1 + pm.tmPos,
          y: alongPos - pm.tmS * 1.5,
          w: pm.tmL, h: pm.tmS,
        };
      } else {
        // 横型: TM縦長、下辺。tmPos<0なら外枠外（下）
        // TM上端y = outer.y2 + |tmPos| - tmL  ... tmPos=-2なら上端y=210+2-5.9=206.1
        // → tmPos<0: outer.y2 - tmPos が下端起点、そこからtmL分上
        // 正しい式: TM上端y = outer.y2 - tmPos - tmL
        // tmPos=-2: 210-(-2)-5.9=206.1（外枠内3.9mm）→ 下端=206.1+5.9=212（外枠外2mm） ✓
        return {
          x: alongPos - pm.tmS * 1.5,
          y: outer.y2 - pm.tmPos - pm.tmL,
          w: pm.tmS, h: pm.tmL,
        };
      }
    }

    function mergeTMs(orientation, ...arrays) {
      const seen = new Set(), result = [];
      for (const arr of arrays)
        for (const tm of arr) {
          const key = (orientation === 'portrait' ? tm.y : tm.x).toFixed(4);
          if (!seen.has(key)) { seen.add(key); result.push(tm); }
        }
      return result;
    }

    // ── 受験番号欄 ───────────────────────────────────────────────
    function calcExamArea(params) {
      const { orientation, pitchName, examDigits, enStart, startMB } = params;
      const pm = PITCH_MASTER[pitchName];
      const outer = getOuter(orientation);
      const tms = [], mbs = [], tmSet = new Set();

      if (orientation === 'portrait') {
        // 数字0〜9=along（下↓）, 桁=perp（右→）
        // 数字ri: cy = enStart + ri * pitch（0が上、9が下）
        // 桁di:   cx = outer.x1 + firstX + di * pitch（左から右）
        for (let di = 0; di < examDigits; di++) {
          const cx = outer.x1 + pm.firstX + di * pm.pitch;
          for (let ri = 0; ri <= 9; ri++) {
            const cy = enStart + ri * pm.pitch;
            if (!tmSet.has(cy)) { tmSet.add(cy); tms.push(calcTM(orientation, pm, cy)); }
            mbs.push({ cx, cy, rL: MB_L/2, rS: MB_S/2, axis:'h', digit:di, num:ri, label:String(ri) });
          }
        }
        // 枠: examDigits桁 × 数字0〜9
        const x1 = outer.x1 + pm.firstX - MB_L/2 - PAD;
        const y1 = enStart - MB_S/2 - PAD;
        const x2 = outer.x1 + pm.firstX + (examDigits-1)*pm.pitch + MB_L/2 + PAD;
        const y2 = enStart + 9*pm.pitch + MB_S/2 + PAD;
        return { tms, mbs, examEnd: enStart + 9*pm.pitch,
                 frame: { x:x1, y:y1, w:x2-x1, h:y2-y1 } };

      } else {
        // 横型: 桁=along（右→）, 数字0〜9=perp（下↓）
        // 受験番号欄の上端 = 解答欄のansStartY（問1のy）に合わせる
        // ansStartY = outer.y2 - firstX - (startMB-1)*pitch（startMB=24）
        const examTopY = outer.y2 - pm.firstX - (startMB - 1) * pm.pitch; // 解答欄の問1と同じy
        // 数字0が上（examTopY）、9が下（examTopY + 9*pitch）
        for (let di = 0; di < examDigits; di++) {
          const cx = enStart + di * pm.pitch;
          if (!tmSet.has(cx)) { tmSet.add(cx); tms.push(calcTM(orientation, pm, cx)); }
          for (let ri = 0; ri <= 9; ri++) {
            const cy = examTopY + ri * pm.pitch;
            mbs.push({ cx, cy, rL: MB_L/2, rS: MB_S/2, axis:'v', digit:di, num:ri, label:String(ri) });
          }
        }
        const x1 = enStart - MB_S/2 - PAD;
        const y1 = examTopY - MB_L/2 - PAD;
        const x2 = enStart + (examDigits-1)*pm.pitch + MB_S/2 + PAD;
        const y2 = examTopY + 9*pm.pitch + MB_L/2 + PAD;
        return { tms, mbs, examEnd: enStart + (examDigits-1)*pm.pitch,
                 frame: { x:x1, y:y1, w:x2-x1, h:y2-y1 } };
      }
    }

    // ── 解答欄 ───────────────────────────────────────────────────
    function calcAnswerArea(params, examEnd) {
      const { orientation, pitchName, questionCount, choiceCount, sectionGap, columnGap, startMB } = params;
      const pm = PITCH_MASTER[pitchName];
      const outer = getOuter(orientation);
      const ansStart = examEnd + sectionGap;
      const tms = [], mbs = [], tmSet = new Set();
      const frames = [];

      if (orientation === 'portrait') {
        // 問題番号=along（下↓）, 選択肢=perp（右→）
        // 縦型: startMBはalong方向で「第startMB TM」から解答を開始する
        // 第nTMのy = outer.y1 + firstX + (n-1)*pitch
        // ansStartYはexamEnd+sectionGapとstartMBによる位置の大きい方を採用
        const startMBY = outer.y1 + pm.firstX + (startMB - 1) * pm.pitch;
        const ansStartY = Math.max(ansStart, startMBY);
        const availAlong = outer.y2 - ansStartY;
        const qPerCol = Math.max(1, Math.floor(availAlong / pm.pitch + 1e-9));
        let qi = 0, colIndex = 0;

        while (qi < questionCount) {
          const colBaseX = outer.x1 + pm.firstX + colIndex * (choiceCount * pm.pitch + columnGap);
          const colStartQi = qi;

          for (let inCol = 0; inCol < qPerCol && qi < questionCount; inCol++, qi++) {
            const cy = ansStartY + inCol * pm.pitch;
            if (!tmSet.has(cy)) {
              tmSet.add(cy);
              tms.push({ ...calcTM(orientation, pm, cy), x: outer.x1 + pm.tmPos });
            }
            for (let ci = 0; ci < choiceCount; ci++) {
              const cx = colBaseX + ci * pm.pitch;
              mbs.push({ cx, cy, rL:MB_L/2, rS:MB_S/2, axis:'h',
                         question:qi+1, choice:ci+1, label:String(ci+1) });
            }
          }
          // この列の枠
          const colEndQi = qi - 1;
          const fx1 = colBaseX - MB_L/2 - PAD;
          const fy1 = ansStartY - MB_S/2 - PAD;
          const fx2 = colBaseX + (choiceCount-1)*pm.pitch + MB_L/2 + PAD;
          const fy2 = ansStartY + (colEndQi - colStartQi)*pm.pitch + MB_S/2 + PAD;
          frames.push({ x:fx1, y:fy1, w:fx2-fx1, h:fy2-fy1 });
          colIndex++;
        }

      } else {
        // 横型:
        //   問題番号 → perp（下↓、y増加）: 上から下へ1,2,3...（x固定）
        //   選択肢   → along（右→）: 1問分が横1列（同じy、ci分だけx増加）
        //   列折返し → perp方向がいっぱいになったら along（右→）に1列分シフト
        //
        //   問1開始y = 第24MB = outer.y1 + firstX + 23 * pitch
        //   同じ列内は全問同じcolBaseX、問ごとにcyが増加
        //   列折返し: colBaseX += choiceCount * pitch

        // 横型 perp方向の座標計算（仕様書セクション15に準拠）:
        //   物理MB番号: 第1MB = outer.y2 - firstX（下辺基準）, 上↑(y減少)方向に増加
        //   論理問題番号: 問1 = 第startMB, 下↓(y増加)方向に増加
        //   → 問1のy = outer.y2 - firstX - (startMB-1)*pitch
        //   → 問mのy = 問1のy + (m-1)*pitch

        const ansStartY = outer.y2 - pm.firstX - (startMB - 1) * pm.pitch; // 問1のy（第startMB）
        const qPerCol = Math.max(1, Math.floor((outer.y2 - ansStartY) / pm.pitch + 1e-9));

        let qi = 0, colIndex = 0;

        while (qi < questionCount) {
          // 列のx起点: 選択肢1（ci=0）のx
          const colBaseX = ansStart + colIndex * choiceCount * pm.pitch;
          const colStartQi = qi;

          for (let inCol = 0; inCol < qPerCol && qi < questionCount; inCol++, qi++) {
            // 問題番号 → perp（下↓、y増加）: 問1のyから下へ
            const cy = ansStartY + inCol * pm.pitch;

            for (let ci = 0; ci < choiceCount; ci++) {
              // 選択肢 → along（右→）: 同じyでxのみ増加
              const cx = colBaseX + ci * pm.pitch;
              if (!tmSet.has(cx)) { tmSet.add(cx); tms.push(calcTM(orientation, pm, cx)); }
              mbs.push({ cx, cy, rL:MB_L/2, rS:MB_S/2, axis:'v',
                         question:qi+1, choice:ci+1, label:String(ci+1) });
            }
          }
          // この列の枠
          const qInCol = qi - colStartQi;
          const fx1 = colBaseX - MB_S/2 - PAD;
          const fy1 = ansStartY - MB_L/2 - PAD;
          const fx2 = colBaseX + (choiceCount - 1) * pm.pitch + MB_S/2 + PAD;
          const fy2 = ansStartY + (qInCol - 1) * pm.pitch + MB_L/2 + PAD;
          frames.push({ x:fx1, y:fy1, w:fx2-fx1, h:fy2-fy1 });
          colIndex++;
        }
      }

      return { tms, mbs, ansStart, frames };
    }

    // ── オーバーフローチェック ──────────────────────────────────
    function checkOverflow(params, exam) {
      const pm = PITCH_MASTER[params.pitchName];
      const outer = getOuter(params.orientation);
      const warns = [];

      if (params.orientation === 'landscape') {
        // 横型: 受験番号欄の数字9がperp（下↓）方向で外枠内か確認
        const startMB = params.startMB;
        const examTopY = outer.y2 - pm.firstX - (startMB - 1) * pm.pitch;
        const examBottomY = examTopY + 9 * pm.pitch;
        if (examBottomY > outer.y2)
          warns.push('受験番号欄の数字9が外枠外にはみ出しています (' + examBottomY.toFixed(2) + 'mm > ' + outer.y2 + 'mm)');
      }

      return warns;
    }

    // ── メイン計算 ───────────────────────────────────────────────
    function calcMarksheet(params) {
      const exam = calcExamArea(params);
      const answer = calcAnswerArea(params, exam.examEnd);
      if (exam.examEnd >= answer.ansStart)
        throw new Error('受験番号欄と解答欄が重なっています');
      const warnings = checkOverflow(params, exam);
      return { params, exam, answer,
               allTMs: mergeTMs(params.orientation, exam.tms, answer.tms),
               warnings };
    }

    // ── SVG描画 ──────────────────────────────────────────────────
    const MM2PX = 96 / 25.4;
    const M = v => v * MM2PX;

    function svgEl(tag, attrs, children=[]) {
      const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, v);
      for (const c of children) e.appendChild(c);
      return e;
    }

    function renderMarksheet(result) {
      const { params, exam, answer, allTMs } = result;
      const paper = PAPER_SIZE[params.orientation];
      const ox = (paper.boardW - paper.outerW) / 2; // A4→B4オフセット
      const oy = (paper.boardH - paper.outerH) / 2;

      const svg = svgEl('svg', {
        width: M(paper.boardW), height: M(paper.boardH),
        viewBox: `0 0 ${M(paper.boardW)} ${M(paper.boardH)}`,
        style: 'display:block; background:#fff; border:1px solid #aaa;',
      });

      // A4外枠（灰破線）
      svg.appendChild(svgEl('rect', {
        x:M(ox), y:M(oy), width:M(paper.outerW), height:M(paper.outerH),
        fill:'none', stroke:'#aaa', 'stroke-width':0.5, 'stroke-dasharray':'3 2',
      }));

      // TM（黒塗り矩形）
      for (const tm of allTMs) {
        svg.appendChild(svgEl('rect', {
          x:M(tm.x+ox), y:M(tm.y+oy), width:M(tm.w), height:M(tm.h),
          fill:'#000',
        }));
      }

      // 受験番号欄枠（マゼンタ実線）
      if (exam.frame) {
        svg.appendChild(svgEl('rect', {
          x:M(exam.frame.x+ox), y:M(exam.frame.y+oy),
          width:M(exam.frame.w), height:M(exam.frame.h),
          fill:'none', stroke:'#FF00FF', 'stroke-width':0.5,
        }));
      }

      // 解答欄枠（マゼンタ実線）
      for (const fr of answer.frames) {
        svg.appendChild(svgEl('rect', {
          x:M(fr.x+ox), y:M(fr.y+oy), width:M(fr.w), height:M(fr.h),
          fill:'none', stroke:'#FF00FF', 'stroke-width':0.5,
        }));
      }

      // MB（マゼンタ楕円＋内部テキスト）
      for (const mb of exam.mbs)   drawMB(svg, mb, ox, oy);
      for (const mb of answer.mbs) drawMB(svg, mb, ox, oy);

      // 問題番号（解答欄のみ、MBの左側に横書き）
      drawQLabels(svg, answer.mbs, params.orientation, ox, oy);

      return svg;
    }

    function drawMB(svg, mb, ox, oy) {
      const cx = M(mb.cx + ox), cy = M(mb.cy + oy);
      const rx = M(mb.axis === 'h' ? mb.rL : mb.rS);
      const ry = M(mb.axis === 'h' ? mb.rS : mb.rL);
      // 楕円（マゼンタ枠・塗りなし）
      svg.appendChild(svgEl('ellipse', {
        cx, cy, rx, ry,
        fill:'none', stroke:'#FF00FF', 'stroke-width':0.4,
      }));
      // MB内テキスト（マゼンタ、サイズ+2pt）
      const fs = Math.min(rx, ry) * 1.1 * 2;
      svg.appendChild(svgEl('text', {
        x:cx, y:cy,
        'text-anchor':'middle', 'dominant-baseline':'central',
        'font-size':fs, 'font-family':'sans-serif',
        fill:'#FF00FF',
      }, [document.createTextNode(mb.label)]));
    }

    function drawQLabels(svg, mbs, orientation, ox, oy) {
      // 問題番号は各問の選択肢1（choice===1）のMBの左側に横書き
      const drawn = new Set();
      for (const mb of mbs) {
        if (mb.choice !== 1) continue;
        const key = mb.question;
        if (drawn.has(key)) continue;
        drawn.add(key);

        const cx = M(mb.cx + ox);
        const cy = M(mb.cy + oy);
        const rx = M(mb.axis === 'h' ? mb.rL : mb.rS);
        const fs = M(1.8) * 2; // MB内テキストと同じ2倍サイズ

        // MBの左端からさらに左に少し余白
        const tx = cx - rx - M(0.8);
        svg.appendChild(svgEl('text', {
          x:tx, y:cy,
          'text-anchor':'end', 'dominant-baseline':'central',
          'font-size':fs, 'font-family':'sans-serif',
          fill:'#FF00FF',
        }, [document.createTextNode(String(mb.question))]));
      }
    }

    // ── UI ──────────────────────────────────────────────────────
    document.getElementById('btnRun').addEventListener('click', function() {
      const pitchName     = document.getElementById('pitch').value;
      const orientation   = document.getElementById('orientation').value;
      const examDigits    = parseInt(document.getElementById('examDigits').value);
      const questionCount = parseInt(document.getElementById('questionCount').value);
      const choiceCount   = parseInt(document.getElementById('choiceCount').value);
      const pm = PITCH_MASTER[pitchName];

      const startMB        = parseInt(document.getElementById('startMB').value) || 24;
      const columnGapMult  = parseFloat(document.getElementById('columnGapMult').value) || 2;
      const sectionGapMult = parseFloat(document.getElementById('sectionGapMult').value) || 2;

      const params = {
        orientation, pitchName, examDigits, questionCount, choiceCount,
        enStart:    pm.firstX + pm.pitch * 3,
        sectionGap: pm.pitch * sectionGapMult,
        columnGap:  pm.pitch * columnGapMult,
        startMB,
      };

      let text = '';
      const log = s => { text += (s||'') + '\n'; };

      try {
        const r = calcMarksheet(params);
        log('=== パラメータ ===');
        log('  向き         : ' + (orientation==='portrait'?'縦型':'横型'));
        log('  ピッチ       : ' + pitchName + ' (' + pm.pitch + 'mm)');
        log('  受験番号桁数 : ' + examDigits);
        log('  問題数       : ' + questionCount);
        log('  選択肢数     : ' + choiceCount);
        log('  enStart      : ' + params.enStart.toFixed(3) + 'mm');
        log();
        log('=== 受験番号欄 ===');
        log('  TM数    : ' + r.exam.tms.length);
        log('  MB数    : ' + r.exam.mbs.length);
        log('  examEnd : ' + r.exam.examEnd.toFixed(3) + 'mm');
        log();
        log('=== 解答欄 ===');
        log('  TM数     : ' + r.answer.tms.length);
        log('  MB数     : ' + r.answer.mbs.length);
        log('  ansStart : ' + r.answer.ansStart.toFixed(3) + 'mm');
        log();
        log('=== 統合TM（重複排除後） ===');
        log('  TM総数 : ' + r.allTMs.length);
        if (r.warnings && r.warnings.length > 0) {
          log();
          log('=== ⚠ 警告 ===');
          r.warnings.forEach(w => log('  ' + w));
        }
        console.log('[marksheet]', r);

        const preview = document.getElementById('preview');
        preview.innerHTML = '';
        const svg = renderMarksheet(r);
        svg.style.maxWidth = (window.innerWidth - 60) + 'px';
        svg.style.height = 'auto';
        preview.appendChild(svg);
      } catch(e) {
        log('⚠ エラー: ' + e.message);
        console.error(e);
      }
      document.getElementById('output').textContent = text;
    });

    document.getElementById('btnClear').addEventListener('click', function() {
      document.getElementById('output').textContent = '';
      document.getElementById('preview').innerHTML = '';
    });
  </script>
</body>
</html>
