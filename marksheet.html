<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークシート生成ツール v4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --bg:#0c0e14;--surf:#13151f;--surf2:#1a1d2b;
  --border:#282d45;--border2:#353b58;
  --acc:#5b8af0;--acc2:#3f6bd4;--acc-glow:rgba(91,138,240,.12);
  --txt:#dde1f0;--txt2:#7c85a8;--txt3:#454c6e;
  --ok:#3ecf8e;--warn:#f5a623;--danger:#f06060;
  --mono:'JetBrains Mono',monospace;--sans:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;height:100vh;overflow:hidden;}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:48px 1fr;height:100vh;}
header{grid-column:1/-1;background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;}
header h1{font-size:14px;font-weight:700;letter-spacing:.06em;}
.badge{font-family:var(--mono);font-size:9px;background:var(--acc-glow);color:var(--acc);border:1px solid rgba(91,138,240,.3);padding:2px 7px;border-radius:3px;letter-spacing:.08em;}
.sidebar{background:var(--surf);border-right:1px solid var(--border);overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.card{background:var(--surf2);border:1px solid var(--border);border-radius:5px;padding:10px 12px;}
.ctitle{font-size:10px;font-weight:700;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.ctitle::before{content:'';display:block;width:2px;height:10px;background:var(--acc);border-radius:1px;}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:6px;}
.row:last-child{margin-bottom:0;}
.row label{font-size:11px;color:var(--txt2);white-space:nowrap;}
.row-col{flex-direction:column;align-items:flex-start;gap:4px;}
input[type=number],select{background:var(--bg);border:1px solid var(--border2);border-radius:3px;color:var(--txt);font-family:var(--mono);font-size:11px;padding:3px 7px;width:80px;text-align:right;outline:none;transition:border-color .15s;}
input[type=number]:focus,select:focus{border-color:var(--acc);}
.rpg{display:flex;gap:4px;flex-wrap:wrap;}
.rpg label{display:flex;align-items:center;gap:3px;cursor:pointer;padding:2px 7px;background:var(--bg);border:1px solid var(--border2);border-radius:3px;font-size:10px;color:var(--txt2);transition:all .12s;white-space:nowrap;}
.rpg input[type=radio]{display:none;}
.rpg label:has(input:checked){background:var(--acc-glow);border-color:var(--acc);color:var(--acc);}
.btn{border:none;border-radius:4px;cursor:pointer;font-family:var(--sans);font-size:11px;font-weight:700;padding:6px 12px;transition:all .15s;display:inline-flex;align-items:center;gap:4px;}
.btn-ghost{background:var(--bg);border:1px solid var(--border2);color:var(--txt2);}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc);}
.btn-primary{background:var(--acc);color:#fff;width:100%;justify-content:center;font-size:12px;padding:9px;}
.btn-primary:hover{background:var(--acc2);}
.qlist{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.qlist::-webkit-scrollbar{width:3px;}
.qlist::-webkit-scrollbar-thumb{background:var(--border2);}
.qitem{display:grid;grid-template-columns:20px 1fr 60px 24px;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:4px 6px;}
.qnum{font-family:var(--mono);font-size:10px;color:var(--txt3);text-align:center;}
.qlabel{font-size:11px;color:var(--txt2);}
.qinput{background:var(--surf);border:1px solid var(--border2);border-radius:3px;color:var(--txt);font-family:var(--mono);font-size:11px;padding:2px 5px;width:100%;text-align:center;outline:none;}
.qinput:focus{border-color:var(--acc);}
.qdel{background:none;border:1px solid var(--border);border-radius:2px;color:var(--txt3);cursor:pointer;font-size:12px;line-height:1;padding:1px 4px;transition:all .12s;}
.qdel:hover{border-color:var(--danger);color:var(--danger);}
.preview{background:#1e1e1e;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px;position:relative;}
.preview::-webkit-scrollbar{width:6px;height:6px;}
.preview::-webkit-scrollbar-thumb{background:#444;border-radius:3px;}
#preview-canvas{background:#fff;box-shadow:0 4px 32px rgba(0,0,0,.6);display:block;}
.statusbar{position:absolute;bottom:10px;right:12px;font-family:var(--mono);font-size:10px;color:var(--txt3);background:var(--surf);border:1px solid var(--border);border-radius:3px;padding:3px 8px;display:flex;gap:10px;}
.ok{color:var(--ok);}.warn{color:var(--warn);}
.hint{font-size:10px;color:var(--txt3);font-family:var(--mono);}
.divider{height:1px;background:var(--border);margin:6px 0;}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>マークシート生成ツール</h1>
  <span class="badge">v4 / SR-3500</span>
  <span class="badge" style="margin-left:auto;cursor:pointer" onclick="generatePDF()">▶ PDF出力</span>
</header>
<aside class="sidebar">
  <div class="card">
    <div class="ctitle">センサーピッチ</div>
    <div class="row row-col">
      <div class="rpg">
        <label><input type="radio" name="pitch" value="0.25" checked><span>0.25</span></label>
        <label><input type="radio" name="pitch" value="1/6"><span>1/6</span></label>
        <label><input type="radio" name="pitch" value="0.2"><span>0.2</span></label>
        <label><input type="radio" name="pitch" value="0.2s"><span>0.2s</span></label>
        <label><input type="radio" name="pitch" value="0.3"><span>0.3</span></label>
        <label><input type="radio" name="pitch" value="0.3F"><span>0.3F</span></label>
      </div>
    </div>
    <div class="divider"></div>
    <div class="row"><label>ピッチ値</label><span class="hint" id="inf-pitch">6.35 mm</span></div>
    <div class="row"><label>TM短辺×長辺</label><span class="hint" id="inf-tm">0.89×5.9 mm</span></div>
    <div class="row"><label>TMオフセット</label><span class="hint" id="inf-tmpos">-2.0 mm</span></div>
  </div>
  <div class="card">
    <div class="ctitle">シート向き・面</div>
    <div class="row">
      <label>向き</label>
      <div class="rpg">
        <label><input type="radio" name="orient" value="tate" checked><span>縦型</span></label>
        <label><input type="radio" name="orient" value="yoko"><span>横型</span></label>
      </div>
    </div>
    <div class="row">
      <label>面</label>
      <div class="rpg">
        <label><input type="radio" name="face" value="omote" checked><span>おもて</span></label>
        <label><input type="radio" name="face" value="ura"><span>うら</span></label>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="ctitle">マークボックス</div>
    <div class="row">
      <label>形状</label>
      <div class="rpg">
        <label><input type="radio" name="mbshape" value="ellipse" checked><span>楕円</span></label>
        <label><input type="radio" name="mbshape" value="rect"><span>矩形</span></label>
      </div>
    </div>
    <div class="row"><label>短辺 (mm)</label><input type="number" id="mb-s" value="2.5" min="0.5" max="10" step="0.1"></div>
    <div class="row"><label>長辺 (mm)</label><input type="number" id="mb-l" value="4" min="0.5" max="10" step="0.1"></div>
  </div>
  <div class="card">
    <div class="ctitle">受験番号欄</div>
    <div class="row">
      <label>表示</label>
      <div class="rpg">
        <label><input type="radio" name="examno" value="show" checked><span>あり</span></label>
        <label><input type="radio" name="examno" value="hide"><span>なし</span></label>
      </div>
    </div>
    <div class="row"><label>桁数</label><input type="number" id="en-digits" value="6" min="1" max="12" step="1"></div>
    <div class="row"><label>開始Y (mm)</label><input type="number" id="en-start" value="10" min="0" max="200" step="0.5"></div>
  </div>
  <div class="card">
    <div class="ctitle">解答欄</div>
    <div class="row"><label>列数</label><input type="number" id="col-count" value="3" min="1" max="8" step="1"></div>
    <div class="row"><label>列間隔 (mm)</label><input type="number" id="col-gap" value="6" min="2" max="40" step="0.5"></div>
    <div class="row"><label>開始Y (mm)</label><input type="number" id="ans-start" value="38" min="5" max="250" step="0.5"></div>
    <div id="ans-warning" style="display:none;margin:4px 0;padding:6px 8px;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.4);border-radius:3px;font-size:10px;color:#f5a623;line-height:1.5;"></div>
    <div class="divider"></div>
    <div class="qlist" id="qlist"></div>
    <div style="display:flex;gap:4px">
      <button class="btn btn-ghost" style="flex:1;font-size:10px" onclick="addQ()">＋ 追加</button>
      <button class="btn btn-ghost" style="flex:1;font-size:10px" onclick="toggleBulk()">まとめて</button>
    </div>
    <div id="bulk-panel" style="display:none;margin-top:6px">
      <div class="row"><label>問数</label><input type="number" id="bk-cnt" value="20" min="1" max="200" style="width:70px"></div>
      <div class="row"><label>選択肢数</label><input type="number" id="bk-ch" value="10" min="2" max="20" style="width:70px"></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:4px;font-size:10px" onclick="execBulk()">追加実行</button>
    </div>
  </div>
  <button class="btn btn-primary" onclick="generatePDF()">PDF を生成・ダウンロード</button>
  <button class="btn btn-ghost" style="width:100%;justify-content:center" onclick="renderPreview()">プレビュー更新</button>
</aside>
<main class="preview">
  <canvas id="preview-canvas"></canvas>
  <div class="statusbar">
    <span id="st-orient">縦型</span>
    <span id="st-tm">TM: —</span>
    <span id="st-mb">MB: —</span>
    <span id="st-ov" class="ok">OK</span>
  </div>
</main>
</div>

// ================================================================
//  定数
// ================================================================
const A4_W=210, A4_H=297;
const B4_W=257, B4_H=364;

const PITCH_DEF={
  '0.25':{ pitch:6.35,  firstX:6.35,  maxMB:33, tmS:0.89, tmL:5.9,  tmPos:-2.0  },
  '1/6': { pitch:4.233, firstX:11.43, maxMB:48, tmS:1.27, tmL:3.81, tmPos:5.085 },
  '0.2': { pitch:5.08,  firstX:11.75, maxMB:40, tmS:0.89, tmL:5.9,  tmPos:-2.0  },
  '0.2s':{ pitch:5.08,  firstX:12.7,  maxMB:40, tmS:0.89, tmL:3.81, tmPos:5.095 },
  '0.3': { pitch:7.62,  firstX:14.50, maxMB:27, tmS:0.89, tmL:7.0,  tmPos:-2.0  },
  '0.3F':{ pitch:7.62,  firstX:17.78, maxMB:24, tmS:0.5,  tmL:5.08, tmPos:7.62  },
};

const TM_MIN_INTERVAL=4.23;
const BOX_PAD=1.5;
const QNUM_COL_W=5.5;
const MAR={top:5, bottom:5, left:8, right:8};

// ================================================================
//  設問リスト
// ================================================================
let questions=[], qidSeed=0, bulkOpen=false;
function addQ(ch=10){ qidSeed++; questions.push({id:qidSeed,choices:ch}); renderQList(); renderPreview(); }
function removeQ(id){ questions=questions.filter(q=>q.id!==id); renderQList(); renderPreview(); }
function toggleBulk(){ bulkOpen=!bulkOpen; document.getElementById('bulk-panel').style.display=bulkOpen?'block':'none'; }
function execBulk(){
  const cnt=parseInt(document.getElementById('bk-cnt').value);
  const ch=parseInt(document.getElementById('bk-ch').value);
  for(let i=0;i<cnt;i++) addQ(ch);
  bulkOpen=false; document.getElementById('bulk-panel').style.display='none';
}
function renderQList(){
  const el=document.getElementById('qlist'); el.innerHTML='';
  questions.forEach((q,idx)=>{
    const d=document.createElement('div'); d.className='qitem';
    d.innerHTML=`<span class="qnum">${idx+1}</span><span class="qlabel">問${idx+1}</span>
      <input class="qinput" type="number" value="${q.choices}" min="2" max="20"
        onchange="questions[${idx}].choices=parseInt(this.value);renderPreview()">
      <button class="qdel" onclick="removeQ(${q.id})">×</button>`;
    el.appendChild(d);
  });
}

// ================================================================
//  パラメータ取得
// ================================================================
function getP(){
  const pk=document.querySelector('input[name=pitch]:checked').value;
  const pd=PITCH_DEF[pk];
  const orient=document.querySelector('input[name=orient]:checked').value;
  const face=document.querySelector('input[name=face]:checked').value;
  const mbShape=document.querySelector('input[name=mbshape]:checked').value;
  const mbS=parseFloat(document.getElementById('mb-s').value);
  const mbL=parseFloat(document.getElementById('mb-l').value);

  // ================================================================
  // 縦型・横型でMBサイズとTM配置が変わるだけ
  //
  // 縦型: MBは横長 → mbW=mbL(長辺), mbH=mbS(短辺)
  //       TMは左辺  → tmFixX=outer.x1+tmPos（固定x）, tmW=tmL, tmH=tmS
  //
  // 横型: MBは縦長 → mbW=mbS(短辺), mbH=mbL(長辺)
  //       TMは下辺  → tmFixY=outer.y2-tmPos-tmL（固定y）, tmW=tmS, tmH=tmL
  //
  // レイアウトロジック（選択肢=右→、設問=下↓、列=右折り返し）は共通
  // ================================================================
  const isTate = orient==='tate';
  return {
    pk, pd, orient, face, mbShape,
    pitch:  pd.pitch,
    firstX: pd.firstX,  // TM端からMB中心までの距離
    tmS: pd.tmS, tmL: pd.tmL, tmPos: pd.tmPos,
    // MB幅・高さ（縦型=横長、横型=縦長）
    mbW: isTate ? mbL : mbS,
    mbH: isTate ? mbS : mbL,
    mbS, mbL,
    // TM幅・高さ（縦型=横長、横型=縦長）
    tmW: isTate ? pd.tmL : pd.tmS,
    tmH: isTate ? pd.tmS : pd.tmL,
    cols:   parseInt(document.getElementById('col-count').value),
    colGap: parseFloat(document.getElementById('col-gap').value),
    ansStart: parseFloat(document.getElementById('ans-start').value),
    showExamNo: document.querySelector('input[name=examno]:checked').value==='show',
    enDigits: parseInt(document.getElementById('en-digits').value),
    enStart: parseFloat(document.getElementById('en-start').value),
  };
}

// ================================================================
//  シート・B4サイズ
// ================================================================
function sheetSize(orient){ return orient==='tate'?{w:A4_W,h:A4_H}:{w:A4_H,h:A4_W}; }
function b4Size(orient)   { return orient==='tate'?{w:B4_W,h:B4_H}:{w:B4_H,h:B4_W}; }
function a4Offset(orient){ const s=sheetSize(orient),b=b4Size(orient); return{ox:(b.w-s.w)/2,oy:(b.h-s.h)/2}; }

// ================================================================
//  外枠
// ================================================================
function getOuter(orient){
  const s=sheetSize(orient);
  return{x1:MAR.left, y1:MAR.top, x2:s.w-MAR.right, y2:s.h-MAR.bottom,
         w:s.w-MAR.left-MAR.right, h:s.h-MAR.top-MAR.bottom};
}

// ================================================================
//  レイアウト計算（縦型・横型 共通ロジック）
// ================================================================
// 縦型・横型ともに「紙面座標(x,y)」で計算
//
// TM配置:
//   縦型: x固定（左辺）= outer.x1 + tmPos
//         y変化: MB中心y - tmS*1.5
//   横型: y固定（下辺）= outer.y2 - tmPos - tmL
//         x変化: MB中心y - tmS*1.5  ← 横型でも「MB中心yからの計算」が正しい
//         ※横型のMBは縦長なので「MB中心y」がTMのx方向位置を決める
//
// MB配置:
//   行方向(y): 選択肢は右→(x増加)、設問は下↓(y増加)
//   TM端からfirstXの位置にMB中心
//   縦型: MB中心x = outer.x1 + firstX
//   横型: MB中心y = outer.y2 - firstX  (下辺から上向きにfirstX)
//
// 選択肢・設問の展開方向は縦型・横型で同じ:
//   選択肢: x方向（右→）に pitch 間隔
//   設問:   y方向（下↓）に pitch 間隔
//   列折り返し: x方向（右へ）

function calcLayout(p, outer){
  const isTate = p.orient==='tate';

  // TM固定座標
  // 縦型おもて: x = outer.x1 + tmPos（左辺外側）
  // 横型おもて: y = outer.y2 - tmPos - tmH（下辺外側）
  const tmFix = p.face==='omote'
    ? (isTate ? outer.x1+p.tmPos : outer.y2-p.tmPos-p.tmH)
    : (isTate ? outer.x2-p.tmPos-p.tmW : outer.y1+p.tmPos);

  // MB垂直方向基準（TM辺からfirstX離れた位置）
  // 縦型: MB中心x = outer.x1 + firstX
  // 横型: MB中心y = outer.y2 - firstX
  const mbPerp = p.face==='omote'
    ? (isTate ? outer.x1+p.firstX : outer.y2-p.firstX)
    : (isTate ? outer.x2-p.firstX : outer.y1+p.firstX);

  // TM変化座標: MB中心（センサー通過方向）- tmS*1.5
  // 縦型: TM_y = MB中心y - tmS*1.5
  // 横型: TM_x = MB中心x - tmS*1.5
  function tmVary(mbAlong){ return mbAlong - p.tmS*1.5; }

  // ----------------------------------------------------------------
  // 受験番号欄
  // ----------------------------------------------------------------
  // 縦型: 0〜9 = y方向、桁 = x方向
  // 横型: 0〜9 = x方向、桁 = y方向（上↑）
  let examLayout=null, examEnd=0;
  if(p.showExamNo){
    const rows=[];
    for(let ri=0;ri<10;ri++){
      const along = p.enStart + ri*p.pitch; // センサー通過方向座標
      const perpCoords=[];
      for(let di=0;di<p.enDigits;di++){
        // 縦型: 桁はx方向（右→）  perp + di*pitch
        // 横型: 桁はy方向（上↑）  perp - di*pitch
        perpCoords.push(isTate
          ? mbPerp + di*p.pitch - p.mbW/2
          : mbPerp - di*p.pitch - p.mbH/2);
      }
      if(isTate){
        rows.push({ri,
          mbY: along - p.mbH/2,
          tmX: tmFix, tmY: tmVary(along),
          xs: perpCoords});
      } else {
        rows.push({ri,
          mbX: along - p.mbW/2,
          tmX: tmVary(along), tmY: tmFix,
          ys: perpCoords});
      }
    }
    if(isTate){
      examEnd = rows[9].mbY + p.mbH + BOX_PAD;
      examLayout={rows,
        frameX1: rows[0].xs[0]-BOX_PAD,
        frameX2: rows[0].xs[p.enDigits-1]+p.mbW+BOX_PAD,
        frameY1: rows[0].mbY-BOX_PAD,
        frameY2: examEnd};
    } else {
      examEnd = rows[9].mbX + p.mbW + BOX_PAD;
      // 横型: 桁はy方向（上↑）なので ys[0]が最下、ys[last]が最上
      examLayout={rows,
        frameX1: rows[0].mbX-BOX_PAD,
        frameX2: examEnd,
        frameY1: rows[0].ys[p.enDigits-1]-BOX_PAD,
        frameY2: rows[0].ys[0]+p.mbH+BOX_PAD};
    }
  }

  // ----------------------------------------------------------------
  // 解答欄開始位置の重なり防止補正
  // ----------------------------------------------------------------
  let ansStart=p.ansStart;
  if(p.showExamNo && examLayout){
    // 枠同士重なりチェック（センサー通過方向）
    const minStart = examEnd + BOX_PAD + (isTate?p.mbH:p.mbW)/2;
    if(ansStart < minStart){
      ansStart = p.ansStart + Math.ceil((minStart-p.ansStart)/p.pitch)*p.pitch;
    }
    // TM間隔チェック
    const lastEnTMend = tmVary(p.enStart+9*p.pitch) + p.tmH;
    const minByTM = lastEnTMend + TM_MIN_INTERVAL + p.tmS*1.5;
    if(ansStart < minByTM){
      ansStart = p.ansStart + Math.ceil((minByTM-p.ansStart)/p.pitch)*p.pitch;
    }
    if(ansStart > p.ansStart){ p._ansUCorrected=ansStart; p._ansUWarning=true; }
  }

  // ----------------------------------------------------------------
  // 解答欄レイアウト
  // ----------------------------------------------------------------
  // 縦型: 選択肢=x方向（右→）、設問=y方向（下↓）、列=x方向折返
  // 横型: 選択肢=y方向（上↑）、設問=x方向（右→）、列=y方向折返（上↑）
  const cols=p.cols, qCount=questions.length, perCol=Math.ceil(qCount/cols);
  const colLayouts=[];

  for(let c=0;c<cols;c++){
    const startQ=c*perCol, endQ=Math.min(startQ+perCol,qCount);
    const maxCh=Math.max(...questions.slice(startQ,endQ).map(q=>q.choices),1);

    // 列cの垂直方向基準（選択肢の第1個の中心座標）
    let colPerp = mbPerp;
    for(let i=0;i<c;i++){
      const mc=Math.max(...questions.slice(i*perCol,Math.min((i+1)*perCol,qCount)).map(q=>q.choices),1);
      // 縦型: 右→（増加）、横型: 上↑（減少）
      if(isTate) colPerp += (mc-1)*p.pitch + p.mbW + p.colGap;
      else        colPerp -= (mc-1)*p.pitch + p.mbH + p.colGap;
    }

    const groups=[];
    for(let qi=startQ;qi<endQ;qi++){
      const q=questions[qi];
      const along = ansStart + (qi-startQ)*p.pitch; // センサー通過方向
      const perpCoords=[];
      for(let ci=0;ci<q.choices;ci++){
        // 縦型: 右→（増加）、横型: 上↑（減少）
        perpCoords.push(isTate
          ? colPerp + ci*p.pitch - p.mbW/2
          : colPerp - ci*p.pitch - p.mbH/2);
      }
      if(isTate){
        groups.push({qi,q,
          mbY: along-p.mbH/2, tmX: tmFix, tmY: tmVary(along),
          xs: perpCoords});
      } else {
        groups.push({qi,q,
          mbX: along-p.mbW/2, tmX: tmVary(along), tmY: tmFix,
          ys: perpCoords});
      }
    }

    const fg=groups[0], lg=groups[groups.length-1];
    if(isTate){
      colLayouts.push({groups,maxCh,
        frameX1: colPerp-BOX_PAD,
        frameX2: colPerp+(maxCh-1)*p.pitch+p.mbW+BOX_PAD,
        frameY1: (fg?fg.mbY:ansStart)-BOX_PAD,
        frameY2: (lg?lg.mbY+p.mbH:ansStart)+BOX_PAD});
    } else {
      // 横型: colPerpが最下の選択肢中心、上↑に展開
      colLayouts.push({groups,maxCh,
        frameX1: (fg?fg.mbX:ansStart)-BOX_PAD,
        frameX2: (lg?lg.mbX+p.mbW:ansStart)+BOX_PAD,
        frameY1: colPerp-(maxCh-1)*p.pitch-p.mbH-BOX_PAD,
        frameY2: colPerp+BOX_PAD});
    }
  }

  return {examLayout, colLayouts};
}

function dedupTMs(tms, orient){
  // 縦型: y方向で重複排除（TMはy方向に並ぶ）
  // 横型: x方向で重複排除（TMはx方向に並ぶ）
  const key = orient==='tate' ? 'y' : 'x';
  const sorted=tms.slice().sort((a,b)=>a[key]-b[key]);
  const result=[];
  for(const tm of sorted){
    if(result.length===0||Math.abs(tm[key]-result[result.length-1][key])>0.01) result.push(tm);
  }
  return result;
}

// ================================================================
//  描画（Canvas/PDF共通）
// ================================================================
function drawAll(r, p){
  const outer=getOuter(p.orient);
  const {examLayout,colLayouts}=calcLayout(p,outer);
  const isTate=p.orient==='tate';
  let tmCount=0, mbCount=0;
  const allTMs=[];
  const DLAB=['十万位','万位','千位','百位','十位','一位'];

  // 外枠
  r.rect(outer.x1,outer.y1,outer.w,outer.h,{color:[0,0,0],lw:0.3});

  // ----------------------------------------------------------------
  // 受験番号欄
  // ----------------------------------------------------------------
  if(examLayout){
    const el=examLayout;
    r.rect(el.frameX1,el.frameY1,el.frameX2-el.frameX1,el.frameY2-el.frameY1,
      {color:[176,0,80],lw:0.3});
    const digLabels=DLAB.slice(DLAB.length-p.enDigits);

    if(isTate){
      // 縦型: 桁=x方向区切り縦線
      el.rows[0].xs.forEach((x,di)=>{
        if(di>0){
          const sep=(el.rows[0].xs[di-1]+p.mbW+x)/2;
          r.line(sep,el.frameY1,sep,el.frameY2,{color:[176,0,80],lw:0.2});
        }
      });
      const entryY=el.frameY1+(el.frameY2-el.frameY1)*0.2;
      r.line(el.frameX1,entryY,el.frameX2,entryY,{color:[176,0,80],lw:0.2});
      el.rows[0].xs.forEach((x,di)=>{
        r.text(x+p.mbW/2,el.frameY1+(entryY-el.frameY1)/2,
          digLabels[di]||'',{size:2.2,color:[60,60,60],align:'center'});
      });
      r.text((el.frameX1+el.frameX2)/2,el.frameY1+(entryY-el.frameY1)/2+3,
        '受験番号欄',{size:2.5,color:[20,20,20],align:'center'});
      el.rows.forEach(row=>{
        allTMs.push({x:row.tmX,y:row.tmY});
        row.xs.forEach(x=>{ r.mb(x,row.mbY,p.mbW,p.mbH,p,String(row.ri)); mbCount++; });
        r.text(el.frameX1-0.5,row.mbY+p.mbH/2,String(row.ri),
          {size:2.5,color:[60,60,60],align:'right'});
      });
    } else {
      // 横型: 桁=y方向区切り横線
      el.rows[0].ys.forEach((y,di)=>{
        if(di>0){
          const sep=(el.rows[0].ys[di-1]+p.mbH+y)/2;
          r.line(el.frameX1,sep,el.frameX2,sep,{color:[176,0,80],lw:0.2});
        }
      });
      const entryX=el.frameX1+(el.frameX2-el.frameX1)*0.2;
      r.line(entryX,el.frameY1,entryX,el.frameY2,{color:[176,0,80],lw:0.2});
      el.rows[0].ys.forEach((y,di)=>{
        r.text(el.frameX1+(entryX-el.frameX1)/2,y+p.mbH/2,
          digLabels[di]||'',{size:2.2,color:[60,60,60],align:'center'});
      });
      r.text(el.frameX1+(entryX-el.frameX1)/2+3,(el.frameY1+el.frameY2)/2,
        '受験番号欄',{size:2.5,color:[20,20,20],align:'center'});
      el.rows.forEach(row=>{
        allTMs.push({x:row.tmX,y:row.tmY});
        row.ys.forEach(y=>{ r.mb(row.mbX,y,p.mbW,p.mbH,p,String(row.ri)); mbCount++; });
        r.text(row.mbX+p.mbW/2,el.frameY2+0.5,String(row.ri),
          {size:2.5,color:[60,60,60],align:'center'});
      });
    }
  }

  // ----------------------------------------------------------------
  // 解答欄
  // ----------------------------------------------------------------
  colLayouts.forEach(col=>{
    if(!col.groups.length) return;
    const fQ=col.groups[0].qi+1, lQ=col.groups[col.groups.length-1].qi+1;
    r.rect(col.frameX1,col.frameY1,col.frameX2-col.frameX1,col.frameY2-col.frameY1,
      {color:[176,0,80],lw:0.3});

    if(isTate){
      // 縦型: 設問番号列を上部横線で区切り
      const qSepY=col.frameY1+BOX_PAD+QNUM_COL_W;
      r.line(col.frameX1,qSepY,col.frameX2,qSepY,{color:[176,0,80],lw:0.2});
      r.text((col.frameX1+col.frameX2)/2,col.frameY1+BOX_PAD+QNUM_COL_W/2,
        `${fQ}〜${lQ}`,{size:2.5,color:[20,20,20],align:'center'});
      col.groups.forEach(grp=>{
        allTMs.push({x:grp.tmX,y:grp.tmY});
        r.text(col.frameX1-0.5,grp.mbY+p.mbH/2,String(grp.qi+1),
          {size:2.5,color:[50,50,50],align:'right'});
        if(grp.qi>col.groups[0].qi){
          const sep=grp.mbY-p.pitch/2+p.mbH/2;
          r.line(col.frameX1,sep,col.frameX2,sep,{color:[220,220,220],lw:0.1});
        }
        grp.xs.forEach((x,ci)=>{
          r.text(x+p.mbW/2,col.frameY1+BOX_PAD+QNUM_COL_W/2,
            String(ci+1),{size:2.2,color:[80,80,80],align:'center'});
        });
        grp.xs.forEach((x,ci)=>{ r.mb(x,grp.mbY,p.mbW,p.mbH,p,String(ci+1)); mbCount++; });
      });
    } else {
      // 横型: 設問番号列を左部縦線で区切り
      const qSepX=col.frameX1+BOX_PAD+QNUM_COL_W;
      r.line(qSepX,col.frameY1,qSepX,col.frameY2,{color:[176,0,80],lw:0.2});
      r.text(col.frameX1+BOX_PAD+QNUM_COL_W/2,(col.frameY1+col.frameY2)/2,
        `${fQ}〜${lQ}`,{size:2.5,color:[20,20,20],align:'center'});
      col.groups.forEach(grp=>{
        allTMs.push({x:grp.tmX,y:grp.tmY});
        r.text(grp.mbX+p.mbW/2,col.frameY2+0.5,String(grp.qi+1),
          {size:2.5,color:[50,50,50],align:'center'});
        if(grp.qi>col.groups[0].qi){
          const sep=grp.mbX-p.pitch/2+p.mbW/2;
          r.line(sep,col.frameY1,sep,col.frameY2,{color:[220,220,220],lw:0.1});
        }
        grp.ys.forEach((y,ci)=>{
          r.text(col.frameX1+BOX_PAD+QNUM_COL_W/2,y+p.mbH/2,
            String(ci+1),{size:2.2,color:[80,80,80],align:'center'});
        });
        grp.ys.forEach((y,ci)=>{ r.mb(grp.mbX,y,p.mbW,p.mbH,p,String(ci+1)); mbCount++; });
      });
    }
  });

  // TM描画（重複排除後）
  dedupTMs(allTMs,p.orient).forEach(tm=>{
    r.tm(tm.x,tm.y,p.tmW,p.tmH); tmCount++;
  });

  return {tmCount,mbcount:mbCount};
}

// ================================================================
//  Canvas レンダラー
// ================================================================
const PX=2.8;
function makeCanvasRenderer(ctx,off){
  const sx=x=>(off.ox+x)*PX, sy=y=>(off.oy+y)*PX;
  return {
    rect(x,y,w,h,st){
      ctx.strokeStyle=`rgb(${st.color.join(',')})`;ctx.lineWidth=st.lw;
      ctx.strokeRect(sx(x),sy(y),w*PX,h*PX);
    },
    line(x1,y1,x2,y2,st){
      ctx.strokeStyle=`rgb(${st.color.join(',')})`;ctx.lineWidth=st.lw;
      ctx.beginPath();ctx.moveTo(sx(x1),sy(y1));ctx.lineTo(sx(x2),sy(y2));ctx.stroke();
    },
    text(x,y,text,opt){
      ctx.fillStyle=`rgb(${opt.color.join(',')})`;
      ctx.font=`${opt.size*PX/2.2}px sans-serif`;
      ctx.textAlign=opt.align||'left';ctx.textBaseline='middle';
      ctx.fillText(text,sx(x),sy(y));
    },
    tm(x,y,w,h){
      ctx.fillStyle='#000';ctx.fillRect(sx(x),sy(y),w*PX,h*PX);
    },
    mb(x,y,w,h,p,label){
      ctx.strokeStyle='rgb(176,0,80)';ctx.lineWidth=0.8;
      if(p.mbShape==='ellipse'){
        ctx.beginPath();ctx.ellipse(sx(x)+w*PX/2,sy(y)+h*PX/2,w*PX/2,h*PX/2,0,0,Math.PI*2);ctx.stroke();
      } else {ctx.strokeRect(sx(x),sy(y),w*PX,h*PX);}
      const maxW=w*PX*0.82, maxH=h*PX*0.82, fs=Math.min(maxH,maxW)*0.85;
      ctx.fillStyle='rgb(176,0,80)';ctx.font=`${fs}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      const tw=ctx.measureText(label).width;
      ctx.save();ctx.translate(sx(x)+w*PX/2,sy(y)+h*PX/2);
      if(tw>maxW)ctx.scale(maxW/tw,1);
      ctx.fillText(label,0,0);ctx.restore();
    },
  };
}

// ================================================================
//  プレビュー
// ================================================================
function renderPreview(){
  const p=getP();
  const b4=b4Size(p.orient), off=a4Offset(p.orient), s=sheetSize(p.orient);
  const canvas=document.getElementById('preview-canvas');
  canvas.width=Math.round(b4.w*PX); canvas.height=Math.round(b4.h*PX);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#e0e0e0';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#fff';ctx.fillRect(off.ox*PX,off.oy*PX,s.w*PX,s.h*PX);
  ctx.strokeStyle='#ccc';ctx.lineWidth=0.5;ctx.strokeRect(off.ox*PX,off.oy*PX,s.w*PX,s.h*PX);
  const r=makeCanvasRenderer(ctx,off);
  const {tmCount,mbCount}=drawAll(r,p);
  document.getElementById('st-orient').textContent=p.orient==='tate'?'縦型':'横型';
  document.getElementById('st-tm').textContent=`TM:${tmCount}`;
  document.getElementById('st-mb').textContent=`MB:${mbCount}`;
  const stEl=document.getElementById('st-ov');
  if(p._ansUWarning){
    stEl.textContent=`開始Y補正→${p._ansUCorrected.toFixed(1)}mm`;
    stEl.className='warn';
    document.getElementById('ans-warning').style.display='block';
    document.getElementById('ans-warning').textContent=`⚠ 受験番号欄と重なるため解答欄開始を ${p._ansUCorrected.toFixed(1)}mm に補正しました`;
  } else {
    stEl.textContent='OK'; stEl.className='ok';
    document.getElementById('ans-warning').style.display='none';
  }
}

// ================================================================
//  PDF レンダラー
// ================================================================
function makePDFRenderer(doc,off){
  const px=x=>off.ox+x, py=y=>off.oy+y;
  return {
    rect(x,y,w,h,st){ doc.setDrawColor(...st.color);doc.setLineWidth(st.lw);doc.rect(px(x),py(y),w,h); },
    line(x1,y1,x2,y2,st){ doc.setDrawColor(...st.color);doc.setLineWidth(st.lw);doc.line(px(x1),py(y1),px(x2),py(y2)); },
    text(x,y,text,opt){
      doc.setFontSize(opt.size*2.8);doc.setTextColor(...opt.color);
      doc.text(text,px(x),py(y),{align:opt.align||'left',baseline:'middle'});
    },
    tm(x,y,w,h){ doc.setFillColor(0);doc.setLineWidth(0);doc.rect(px(x),py(y),w,h,'F'); },
    mb(x,y,w,h,p,label){
      doc.setDrawColor(176,0,80);doc.setLineWidth(0.1);
      if(p.mbShape==='ellipse') doc.ellipse(px(x)+w/2,py(y)+h/2,w/2,h/2);
      else doc.rect(px(x),py(y),w,h);
      doc.setTextColor(176,0,80);
      const fs=Math.min(h*0.82*2.8,w*0.82*2.8/label.length*1.6);
      doc.setFontSize(Math.max(fs,2));
      doc.text(label,px(x)+w/2,py(y)+h/2,{align:'center',baseline:'middle'});
    },
  };
}

// ================================================================
//  PDF生成
// ================================================================
function generatePDF(){
  const{jsPDF}=window.jspdf;
  const p=getP(), b4=b4Size(p.orient), off=a4Offset(p.orient);
  const doc=new jsPDF({unit:'mm',format:[b4.w,b4.h],orientation:'portrait'});
  drawAll(makePDFRenderer(doc,off),p);
  doc.setFontSize(3);doc.setTextColor(160);
  doc.text(`PITCH:${p.pk}|${p.orient==='tate'?'縦':'横'}型|TM:制御|FACE:${p.face==='omote'?'表':'裏'}|MB:${p.mbShape}`,
    b4.w/2,b4.h-2,{align:'center'});
  doc.save(`marksheet_v4_${p.orient}_${p.pk.replace('/','')}_${p.face}.pdf`);
}

// ================================================================
//  UI初期化
// ================================================================
document.querySelectorAll('input[name=pitch]').forEach(r=>r.addEventListener('change',()=>{
  const d=PITCH_DEF[r.value];
  document.getElementById('inf-pitch').textContent=d.pitch+' mm';
  document.getElementById('inf-tm').textContent=d.tmS+'×'+d.tmL+' mm';
  document.getElementById('inf-tmpos').textContent=d.tmPos+' mm';
  renderPreview();
}));
['mb-s','mb-l','col-count','col-gap','ans-start','en-digits','en-start'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('change',renderPreview); el.addEventListener('input',renderPreview);
});
document.querySelectorAll('input[name=face],input[name=orient],input[name=mbshape],input[name=examno]')
  .forEach(r=>r.addEventListener('change',renderPreview));

for(let i=0;i<60;i++) addQ(10);
