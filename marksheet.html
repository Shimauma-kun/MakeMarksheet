<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マークシート生成ツール — SR-3500</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #161820;
    --panel: #1c1e24;
    --border: #2a2d38;
    --accent: #e84393;
    --accent2: #00d4a0;
    --text: #e8eaf0;
    --text-dim: #6b7080;
    --text-mid: #9ba3b8;
    --warn: #f59e0b;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
  }
  header .logo {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
  }
  header .title {
    font-size: 13px;
    color: var(--text-mid);
    font-weight: 300;
  }
  header .device-badge {
    margin-left: auto;
    background: #1a2a20;
    border: 1px solid #2a4a38;
    color: var(--accent2);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 3px;
  }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 49px);
  }

  /* --- LEFT PANEL: Controls --- */
  .controls {
    width: 280px;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .section-header {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 16px 16px 8px;
    border-bottom: 1px solid var(--border);
  }

  .ctrl-group {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--text-mid);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ctrl-label span {
    font-family: var(--mono);
    color: var(--accent2);
    font-size: 10px;
  }

  .seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .seg button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-mid);
    font-family: var(--sans);
    font-size: 12px;
    padding: 7px 4px;
    cursor: pointer;
    transition: all .15s;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active {
    background: var(--accent);
    color: #fff;
  }
  .seg button:hover:not(.active) { background: var(--panel); color: var(--text); }

  select, input[type=number], input[type=text] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    width: 100%;
    appearance: none;
    outline: none;
    transition: border-color .15s;
  }
  select:focus, input:focus {
    border-color: var(--accent);
  }
  select { cursor: pointer; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .pitch-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 10px;
  }
  .pitch-table th {
    color: var(--text-dim);
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
    font-weight: 500;
  }
  .pitch-table td {
    color: var(--text-mid);
    padding: 3px 6px;
  }
  .pitch-table tr.active-row td {
    color: var(--accent2);
  }

  .generate-btn {
    margin: 16px;
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity .15s;
    text-transform: uppercase;
  }
  .generate-btn:hover { opacity: .85; }

  .warn-box {
    margin: 0 16px 16px;
    background: #2a1f0a;
    border: 1px solid #5a3f10;
    border-radius: 4px;
    padding: 10px 12px;
    display: none;
  }
  .warn-box.visible { display: block; }
  .warn-box .warn-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--warn);
    letter-spacing: .1em;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .warn-box ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .warn-box li {
    font-size: 11px;
    color: #d4a040;
  }
  .warn-box li::before { content: '⚠ '; }

  /* --- RIGHT PANEL: Canvas --- */
  .canvas-area {
    flex: 1;
    overflow: auto;
    background: #0a0b0d;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px;
  }

  #sheet-wrapper {
    background: #fff;
    box-shadow: 0 8px 60px rgba(0,0,0,.8), 0 0 0 1px #333;
    position: relative;
    flex-shrink: 0;
  }

  #sheet-canvas {
    display: block;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .info-row {
    display: flex;
    gap: 4px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .info-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 3px;
    color: var(--text-mid);
  }
  .info-chip b { color: var(--accent2); font-weight: 500; }

  .computed-vals {
    padding: 8px 0 0;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cv-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
  .cv-row span:last-child { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div class="logo">MarkSheet</div>
  <div class="title">マークシート生成ツール</div>
  <div class="device-badge">SECONIK SR-3500</div>
</header>

<div class="layout">
  <!-- LEFT: Controls -->
  <div class="controls">

    <div class="section-header">基本設定</div>
    <div class="ctrl-group">
      <div>
        <div class="ctrl-label">向き</div>
        <div class="seg" id="seg-orient">
          <button class="active" data-val="portrait">縦型 A4</button>
          <button data-val="landscape">横型 A4</button>
        </div>
      </div>
      <div>
        <div class="ctrl-label">ピッチ <span id="lbl-pitch">0.25</span></div>
        <select id="sel-pitch">
          <option value="0.25">0.25</option>
          <option value="1/6">1/6</option>
          <option value="0.2">0.2</option>
          <option value="0.2s">0.2s</option>
          <option value="0.3">0.3</option>
          <option value="0.3F">0.3F</option>
        </select>
      </div>
      <div>
        <div class="ctrl-label">TM間隔 (mm) <span id="lbl-tmi">4.23</span></div>
        <input type="number" id="inp-tmi" value="4.23" min="4.23" step="0.01">
      </div>
    </div>

    <div class="section-header">解答欄</div>
    <div class="ctrl-group">
      <div class="row2">
        <div>
          <div class="ctrl-label">問題数</div>
          <input type="number" id="inp-qcount" value="50" min="1" max="300">
        </div>
        <div>
          <div class="ctrl-label">選択肢数</div>
          <input type="number" id="inp-ccount" value="5" min="1" max="20">
        </div>
      </div>
      <div id="row-skipmb">
        <div class="ctrl-label">開始オフセット (skipMB) <span id="lbl-skip">2</span></div>
        <input type="number" id="inp-skip" value="2" min="0" max="10">
      </div>
      <div class="row2">
        <div>
          <div class="ctrl-label">列ギャップ<span id="lbl-colgap-unit">(pitch×)</span></div>
          <input type="number" id="inp-colgap" value="2" min="0" step="0.5">
        </div>
        <div>
          <div class="ctrl-label">セクションギャップ (tmInterval×)</div>
          <input type="number" id="inp-secgap" value="2" min="0" step="0.5">
        </div>
      </div>
    </div>

    <div class="section-header">受験番号欄</div>
    <div class="ctrl-group">
      <div>
        <div class="ctrl-label">桁数 <span id="lbl-digits">5</span></div>
        <input type="number" id="inp-digits" value="5" min="1" max="20">
      </div>
    </div>

    <div class="section-header">ピッチマスター参照</div>
    <div class="ctrl-group">
      <table class="pitch-table" id="pitch-table">
        <thead>
          <tr><th>ピッチ</th><th>pitch</th><th>firstX</th><th>maxMB</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="computed-vals" id="computed-vals"></div>
    </div>

    <button class="generate-btn" id="btn-gen">▶ プレビュー更新</button>
    <div class="warn-box" id="warn-box">
      <div class="warn-title">警告</div>
      <ul id="warn-list"></ul>
    </div>
  </div>

  <!-- RIGHT: Canvas -->
  <div class="canvas-area">
    <div id="sheet-wrapper">
      <canvas id="sheet-canvas"></canvas>
    </div>
  </div>
</div>

<script>
// =============================================
// PITCH MASTER
// =============================================
const PITCH_MASTER = {
  '0.25': { pitch:6.35,   firstX:6.35,  maxMB:33, tmS:0.89, tmL:5.9,  tmPos:-2.0 },
  '1/6':  { pitch:4.233,  firstX:11.43, maxMB:48, tmS:1.27, tmL:3.81, tmPos:5.085 },
  '0.2':  { pitch:5.08,   firstX:11.75, maxMB:40, tmS:0.89, tmL:5.9,  tmPos:-2.0 },
  '0.2s': { pitch:5.08,   firstX:12.7,  maxMB:40, tmS:0.89, tmL:3.81, tmPos:5.095 },
  '0.3':  { pitch:7.62,   firstX:14.50, maxMB:27, tmS:0.89, tmL:7.0,  tmPos:-2.0 },
  '0.3F': { pitch:7.62,   firstX:17.78, maxMB:24, tmS:0.5,  tmL:5.08, tmPos:7.62 },
};

// Paper sizes (mm)
const PAPER = {
  portrait:  { a4w:210, a4h:297, b4w:257, b4h:364 },
  landscape: { a4w:297, a4h:210, b4w:364, b4h:257 },
};

// MB size (mm)
const MB_LONG = 4, MB_SHORT = 2;
const PAD = 2; // frame padding mm
const FIXED_SKIP_MB = 2; // 第1・第2MBは常に使用しない（SR-3500仕様）

// =============================================
// State
// =============================================
let state = {
  orientation: 'portrait',
  pitchName: '0.25',
  tmInterval: 4.23,
  questionCount: 50,
  choiceCount: 5,
  skipMB: 2,
  columnGapMult: 2,
  sectionGapMult: 2,
  examDigits: 5,
};

// =============================================
// DOM refs
// =============================================
const canvas = document.getElementById('sheet-canvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('sheet-wrapper');
const warnBox = document.getElementById('warn-box');
const warnList = document.getElementById('warn-list');
const computedVals = document.getElementById('computed-vals');
const rowSkipMb = document.getElementById('row-skipmb');

// =============================================
// UI Bindings
// =============================================
function initPitchTable() {
  const tbody = document.querySelector('#pitch-table tbody');
  tbody.innerHTML = '';
  Object.entries(PITCH_MASTER).forEach(([name, p]) => {
    const tr = document.createElement('tr');
    tr.dataset.pitch = name;
    tr.innerHTML = `<td>${name}</td><td>${p.pitch}</td><td>${p.firstX}</td><td>${p.maxMB}</td>`;
    tbody.appendChild(tr);
  });
  updatePitchTable();
}

function updatePitchTable() {
  document.querySelectorAll('#pitch-table tbody tr').forEach(tr => {
    tr.classList.toggle('active-row', tr.dataset.pitch === state.pitchName);
  });
}

// Segmented buttons
document.querySelectorAll('#seg-orient button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#seg-orient button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.orientation = btn.dataset.val;
    document.getElementById('lbl-colgap-unit').textContent =
      state.orientation === 'portrait' ? '(pitch×)' : '(tmInterval×)';
    render();
  });
});

// Select
document.getElementById('sel-pitch').addEventListener('change', e => {
  state.pitchName = e.target.value;
  document.getElementById('lbl-pitch').textContent = e.target.value;
  updatePitchTable();
  render();
});

// Numbers
function bindNum(id, key, label) {
  const el = document.getElementById(id);
  const lbl = label ? document.getElementById(label) : null;
  el.addEventListener('input', () => {
    state[key] = parseFloat(el.value) || 0;
    if (lbl) lbl.textContent = el.value;
    render();
  });
}
bindNum('inp-tmi',    'tmInterval',     'lbl-tmi');
bindNum('inp-qcount', 'questionCount');
bindNum('inp-ccount', 'choiceCount');
bindNum('inp-skip',   'skipMB',         'lbl-skip');
bindNum('inp-colgap', 'columnGapMult');
bindNum('inp-secgap', 'sectionGapMult');
bindNum('inp-digits', 'examDigits',     'lbl-digits');

document.getElementById('btn-gen').addEventListener('click', render);

// =============================================
// SCALE: mm -> canvas pixels
// =============================================
let MM2PX = 3.7795; // default, recalculated

function mm(v) { return v * MM2PX; }

// =============================================
// WARNINGS
// =============================================
function checkWarnings(p, outer) {
  const warns = [];
  if (state.tmInterval < 4.23) warns.push('TM間隔が最小値(4.23mm)未満です');

  if (state.orientation === 'landscape') {
    // 横型: 数字9のy check
    const examTopY = outer.y2 - p.firstX - 29 * p.pitch;
    const y9 = examTopY + 9 * p.pitch;
    if (y9 > outer.y2) warns.push('受験番号欄の数字9行が外枠外にはみ出します');
  }
  return warns;
}

// =============================================
// COMPUTED VALUES DISPLAY
// =============================================
function showComputedVals(p, outer) {
  const lines = [];
  if (state.orientation === 'portrait') {
    const enStart = p.firstX + state.tmInterval * 3;
    const examEndY = enStart + 9 * state.tmInterval;
    const sectionGap = p.pitch * state.sectionGapMult;
    const ansStartY = examEndY + sectionGap;
    lines.push(['enStart (along)', enStart.toFixed(2) + 'mm']);
    lines.push(['ansStartY', ansStartY.toFixed(2) + 'mm']);
    lines.push(['columnGap', (p.pitch * state.columnGapMult).toFixed(2) + 'mm']);
  } else {
    const ansStartY = outer.y2 - p.firstX - 29 * p.pitch;
    const enStart = p.firstX + state.tmInterval * 3;
    lines.push(['ansStartY (固定)', ansStartY.toFixed(2) + 'mm']);
    lines.push(['enStart (along)', enStart.toFixed(2) + 'mm']);
  }
  lines.push(['pitch', p.pitch + 'mm']);
  lines.push(['tmInterval', state.tmInterval.toFixed(2) + 'mm']);
  computedVals.innerHTML = lines.map(([k,v]) =>
    `<div class="cv-row"><span>${k}</span><span>${v}</span></div>`
  ).join('');
}

// =============================================
// MAIN RENDER
// =============================================
function render() {
  const p = PITCH_MASTER[state.pitchName];
  const paper = PAPER[state.orientation];
  const isPortrait = state.orientation === 'portrait';

  // A4 outer (relative to itself, origin 0,0)
  const outer = { x1:0, y1:0, x2:paper.a4w, y2:paper.a4h };

  // Warnings
  const warns = checkWarnings(p, outer);
  warnList.innerHTML = warns.map(w=>`<li>${w}</li>`).join('');
  warnBox.classList.toggle('visible', warns.length > 0);

  // Computed vals
  showComputedVals(p, outer);

  // Setup canvas
  const DPR = window.devicePixelRatio || 1;
  const DISPLAY_W = 680; // canvas display width px
  MM2PX = DISPLAY_W / paper.b4w;

  const canvasW = Math.round(mm(paper.b4w));
  const canvasH = Math.round(mm(paper.b4h));
  canvas.width  = canvasW * DPR;
  canvas.height = canvasH * DPR;
  canvas.style.width  = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.scale(DPR, DPR);
  wrapper.style.width  = canvasW + 'px';
  wrapper.style.height = canvasH + 'px';

  // B4 offset
  const ofx = (paper.b4w - paper.a4w) / 2;
  const ofy = (paper.b4h - paper.a4h) / 2;

  // Draw B4 background (white paper)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Draw A4 outer frame (light grey)
  ctx.strokeStyle = '#cccccc';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(mm(ofx), mm(ofy), mm(paper.a4w), mm(paper.a4h));

  // --- Coordinate helpers (A4 relative, then +offset) ---
  function X(x) { return mm(ofx + x); }
  function Y(y) { return mm(ofy + y); }

  // =============================================
  // Compute positions
  // =============================================
  const tmInterval = state.tmInterval;
  const pitch = p.pitch;
  const firstX = p.firstX;
  const tmS = p.tmS;
  const tmL = p.tmL;
  const tmPos = p.tmPos;
  const skipMB = state.skipMB; // 縦型・横型ともにユーザー設定をそのまま使用

  const MARGIN = 9; // along方向の両端余白(mm): 外枠端からMB/TM端まで
  // MB中心 = MARGIN + MB短辺の半分（along方向の寸法はMB_SHORT=2mm）
  const enStart = MARGIN + MB_SHORT / 2; // = 10mm
  // 縦型: sectionGap = 値×tmInterval、columnGap = 値×pitch
  // 横型: sectionGap = 値×tmInterval、columnGap = 値×tmInterval
  const sectionGap = tmInterval * state.sectionGapMult;
  const columnGap = isPortrait
    ? pitch * state.columnGapMult
    : tmInterval * state.columnGapMult;

  // =============================================
  // Draw TMs for a given set of along-positions
  // =============================================
  const tmAlongPositions = new Set(); // deduplicate

  function collectTM(alongCenter) {
    // along center = MB中心のalong座標, TM上端(縦型y) or TM左端(横型x) = along - tmS*1.5
    const key = alongCenter.toFixed(3);
    tmAlongPositions.add(parseFloat(alongCenter.toFixed(3)));
  }

  function drawAllTMs() {
    ctx.fillStyle = '#000000';
    const sorted = [...tmAlongPositions].sort((a,b)=>a-b);
    sorted.forEach(alongCenter => {
      if (isPortrait) {
        // TM left edge x = outer.x1 + tmPos (may be negative = outside)
        const tx = outer.x1 + tmPos;
        // TM top y = alongCenter - tmS * 1.5
        const ty = alongCenter - tmS * 1.5;
        // TM size: along=tmS(短辺=縦), perp=tmL(長辺=横)
        ctx.fillRect(X(tx), Y(ty), mm(tmL), mm(tmS));
      } else {
        // Landscape
        // TM top y = outer.y2 - tmPos - tmL  (tmPos<0 → outside bottom)
        const ty = outer.y2 - tmPos - tmL;
        // TM left x = alongCenter - tmS * 1.5
        const tx = alongCenter - tmS * 1.5;
        // TM size: along=tmS(短辺=横), perp=tmL(長辺=縦)
        ctx.fillRect(X(tx), Y(ty), mm(tmS), mm(tmL));
      }
    });
  }

  // =============================================
  // Draw a single MB (ellipse)
  // =============================================
  function drawMB(cx, cy, isPortrait, fill=false) {
    // Portrait: mbL(4mm)=perp(右), mbS(2mm)=along(下) → 横長楕円
    // Landscape: mbL(4mm)=along(右), mbS(2mm)=perp(下) → 縦長楕円
    const rX = isPortrait ? mm(MB_LONG/2) : mm(MB_SHORT/2);
    const rY = isPortrait ? mm(MB_SHORT/2) : mm(MB_LONG/2);
    ctx.beginPath();
    ctx.ellipse(X(cx), Y(cy), rX, rY, 0, 0, Math.PI*2);
    if (fill) {
      ctx.fillStyle = '#e84393';
      ctx.fill();
    } else {
      ctx.strokeStyle = '#e84393';
      ctx.lineWidth = 0.7;
      ctx.stroke();
    }
  }

  // Draw text inside MB
  function drawMBText(cx, cy, text) {
    ctx.fillStyle = '#e84393';
    ctx.font = `${mm(MB_SHORT * 1.25)}px 'IBM Plex Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, X(cx), Y(cy));
  }

  // Draw question number label
  function drawQLabel(cx, cy, text) {
    ctx.fillStyle = '#e84393';
    ctx.font = `${mm(MB_SHORT * 1.5)}px 'Noto Sans JP', sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, X(cx) - mm(MB_LONG/2) - mm(0.5), Y(cy));
  }

  // Draw frame rect around a section
  function drawFrame(x1, y1, x2, y2) {
    ctx.strokeStyle = '#e84393';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(X(x1 - PAD), Y(y1 - PAD), mm(x2-x1 + PAD*2), mm(y2-y1 + PAD*2));
  }

  // =============================================
  // PORTRAIT Layout
  // =============================================
  if (isPortrait) {
    // --- Exam Number Section ---
    // 桁: perp(右), MB中心x = outer.x1 + firstX + (skipMB + di)*pitch
    // 数字: along(下), MB中心y = enStart + ri*tmInterval
    const examDigits = state.examDigits;

    // along range for exam
    const enStartY = enStart;
    const enEndY   = enStart + 9 * tmInterval;

    // perp range for exam
    const enStartX = outer.x1 + firstX + skipMB * pitch;
    const enEndX   = enStartX + (examDigits - 1) * pitch;

    // Collect TMs for exam
    for (let ri = 0; ri <= 9; ri++) {
      collectTM(enStart + ri * tmInterval);
    }

    // Draw exam frame
    drawFrame(
      enStartX - MB_LONG/2, enStartY - MB_SHORT/2,
      enEndX   + MB_LONG/2, enEndY   + MB_SHORT/2
    );

    // Draw exam MBs
    for (let di = 0; di < examDigits; di++) {
      const cx = outer.x1 + firstX + (skipMB + di) * pitch;
      for (let ri = 0; ri <= 9; ri++) {
        const cy = enStart + ri * tmInterval;
        drawMB(cx, cy, true);
        drawMBText(cx, cy, ri.toString());
      }
    }

    // --- Answer Section ---
    const ansStartY = enEndY + sectionGap;

    // How many questions fit per column
    const questionsPerCol = state.questionCount;
    // colWidth: 選択肢1中心〜選択肢N中心までの距離
    const colWidth = (state.choiceCount - 1) * pitch;

    // Calculate columns (wrap questions)
    // First colBaseX: outer.x1 + firstX + skipMB*pitch
    const baseX = outer.x1 + firstX + skipMB * pitch;

    // Figure out how many rows each column can hold
    // (just lay them all in columns that fit within page)
    const maxYmm = outer.y2 - MARGIN - MB_SHORT / 2; // 下端: 外枠端からMB端まで9mm
    const colMBrows = Math.floor((maxYmm - ansStartY - MB_SHORT/2) / tmInterval) + 1;
    const qPerCol = Math.min(colMBrows, state.questionCount);

    // Collect TMs for answer
    const ansEndY_actual = { val: ansStartY };

    let qi = 0;
    let colIndex = 0;
    const colPositions = []; // for frame

    while (qi < state.questionCount) {
      const colBaseX = baseX + colIndex * (colWidth + columnGap);
      const colStartQ = qi;
      let frameMinY = Infinity, frameMaxY = -Infinity;

      for (let r = 0; r < qPerCol && qi < state.questionCount; r++, qi++) {
        const cy = ansStartY + r * tmInterval;
        collectTM(cy);
        frameMinY = Math.min(frameMinY, cy);
        frameMaxY = Math.max(frameMaxY, cy);
        ansEndY_actual.val = Math.max(ansEndY_actual.val, cy);

        // Question label
        drawQLabel(colBaseX, cy, `${qi+1}`);

        for (let ci = 0; ci < state.choiceCount; ci++) {
          const cx = colBaseX + ci * pitch;
          drawMB(cx, cy, true);
          drawMBText(cx, cy, (ci+1).toString());
        }
      }

      if (colPositions.length <= colIndex) {
        colPositions.push({
          x1: colBaseX - MB_LONG/2,
          y1: frameMinY - MB_SHORT/2,
          x2: colBaseX + (state.choiceCount-1)*pitch + MB_LONG/2,
          y2: frameMaxY + MB_SHORT/2,
        });
      }
      colIndex++;
    }

    // Draw answer frames
    colPositions.forEach(f => {
      drawFrame(f.x1, f.y1, f.x2, f.y2);
    });

    // Draw all TMs
    drawAllTMs();

  } else {
    // =============================================
    // LANDSCAPE Layout
    // =============================================
    // 横型: 第1MBはouter.y2-firstX（下）、第30MBが上端（固定）
    // skipMB=0 → 第1〜第30MB全使用、skipMB=2 → 第3〜第30MB使用（下側をスキップ）
    // ansStartY（問1の位置=上端）は常に第30MB位置で固定
    // 1列あたりの最大行数を (30 - skipMB) で制限することでskipMBを反映
    const mbBase   = outer.y2 - firstX;          // 第1MBのy（最下行）
    const ansStartY = mbBase - 29 * pitch;        // 第30MBのy（最上行・固定）
    const examTopY  = ansStartY;
    const maxRowsPerCol = 30 - skipMB;            // 使用可能な行数上限

    // --- Exam Number Section (along=right, perp=down) ---
    const enStartX = enStart; // along第4TM
    const examDigits = state.examDigits;

    // 桁: along(右), MB中心x = enStart + di*tmInterval
    // 数字: perp(下), MB中心y = examTopY + ri*pitch

    // Collect TMs for exam
    for (let di = 0; di < examDigits; di++) {
      collectTM(enStart + di * tmInterval);
    }

    const enStartXcoord = enStart;
    const enEndXcoord   = enStart + (examDigits-1) * tmInterval;
    const enStartYcoord = examTopY;
    const enEndYcoord   = examTopY + 9 * pitch;

    drawFrame(
      enStartXcoord - MB_SHORT/2, enStartYcoord - MB_LONG/2,
      enEndXcoord   + MB_SHORT/2, enEndYcoord   + MB_LONG/2
    );

    for (let di = 0; di < examDigits; di++) {
      const cx = enStart + di * tmInterval;
      for (let ri = 0; ri <= 9; ri++) {
        const cy = examTopY + ri * pitch;
        drawMB(cx, cy, false);
        drawMBText(cx, cy, ri.toString());
      }
    }

    // --- Answer Section ---
    // 選択肢: along(右), MB中心x = ansStart + colIndex*choiceCount*tmInterval + ci*tmInterval
    // 問題: perp(下), MB中心y = ansStartY + qi*pitch

    const examEndX = enEndXcoord;
    const ansStart = examEndX + sectionGap;

    // colWidth: 選択肢1中心〜選択肢N中心までの距離
    const colWidth = (state.choiceCount - 1) * tmInterval;

    let qi = 0;
    let colIndex = 0;
    const maxXmm = outer.x2 - MARGIN - MB_SHORT / 2; // 右端: 外枠端からMB端まで9mm

    while (qi < state.questionCount) {
      const colBaseX = ansStart + colIndex * (colWidth + columnGap);
      if (colBaseX > maxXmm) break; // overflow guard

      let frameMinY = Infinity, frameMaxY = -Infinity;
      let frameMinX = colBaseX - MB_SHORT/2;
      let frameMaxX = colBaseX + (state.choiceCount-1)*tmInterval + MB_SHORT/2;

      // skipMBぶん下側をスキップした行数上限を適用
      const qThisCol = Math.min(maxRowsPerCol, state.questionCount - qi);

      for (let r = 0; r < qThisCol; r++, qi++) {
        const cy = ansStartY + r * pitch;
        frameMinY = Math.min(frameMinY, cy - MB_LONG/2);
        frameMaxY = Math.max(frameMaxY, cy + MB_LONG/2);

        // Question label (above first choice)
        drawQLabel(colBaseX, cy, `${qi+1}`);

        for (let ci = 0; ci < state.choiceCount; ci++) {
          const cx = colBaseX + ci * tmInterval;
          collectTM(cx);
          drawMB(cx, cy, false);
          drawMBText(cx, cy, (ci+1).toString());
        }
      }

      drawFrame(frameMinX, frameMinY, frameMaxX, frameMaxY);
      colIndex++;
    }

    // Draw all TMs
    drawAllTMs();
  }
}

// =============================================
// Init
// =============================================
initPitchTable();
render();
</script>
